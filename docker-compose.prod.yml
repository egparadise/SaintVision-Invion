version: '3.8'

services:
  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    container_name: saintvision-web
    ports:
      - "8443:443"
      - "8081:80"
    volumes:
      - type: bind
        # Compose v2.15 ignores create_host_path=false; require an explicit
        # external directory so a missing file cannot become a host directory.
        source: ${SAINTVISION_DEV_CERT_DIR:?Set an existing external development TLS certificate directory}/saintvision.crt
        target: /etc/ssl/certs/saintvision.crt
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${SAINTVISION_DEV_CERT_DIR:?Set an existing external development TLS certificate directory}/saintvision.key
        target: /etc/ssl/private/saintvision.key
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${INV_WEB_AUTH_CONFIG:?Set an existing public OAuth configuration JavaScript file}
        target: /usr/share/nginx/html/auth-config.js
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      control-plane:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - saintvision-net

  control-plane:
    build:
      context: .
      dockerfile: deploy/Dockerfile.backend
    container_name: saintvision-control-plane
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      - INV_BUSINESS_DSN=${INV_BUSINESS_DSN:?Set a deployment-specific non-owner login DSN}
      - INV_RUNTIME_DSN=${INV_RUNTIME_DSN:?Set the non-owner kernel login DSN}
      - INV_RECOVERY_EPOCH=${INV_RECOVERY_EPOCH:?Set the reconciled database recovery epoch}
      - INV_API_CONFIG=/run/saintvision/api.json
      # The API creates measured lease/plan authority only under the same
      # explicit rollout switch as the private worker.  Default remains off.
      - INV_BUILDKIT_PRODUCT_ENABLED=${INV_BUILDKIT_PRODUCT_ENABLED:-0}
      - PORT=8080
      # The business release route reads the kernel commitment observation back
      # over HTTP. Kernel and business share this process and port, so the
      # default is the loopback self URL; set it explicitly only for a split
      # deployment.
      - INV_KERNEL_BASE_URL=${INV_KERNEL_BASE_URL:-http://127.0.0.1:8080}
    volumes:
      - type: volume
        source: api_config
        target: /run/saintvision
        read_only: true
        volume:
          nocopy: true
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/readyz"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    depends_on:
      - postgres
    restart: unless-stopped
    networks:
      - saintvision-net

  worker:
    build:
      context: .
      dockerfile: deploy/Dockerfile.backend
    container_name: saintvision-worker
    command: ["python", "-m", "inv.worker"]
    environment:
      - INV_RUNTIME_DSN=${INV_RUNTIME_DSN:?Set the non-owner kernel login DSN}
      - INV_RECOVERY_EPOCH=${INV_RECOVERY_EPOCH:?Set the reconciled database recovery epoch}
      - INV_API_CONFIG=/run/saintvision/api.json
      - INV_WORKER_CONFIG=/run/saintvision-worker/worker.json
      # Product BuildKit work is an explicit rollout decision.  The delivery
      # worker still runs while this remains at its safe default of zero.
      - INV_BUILDKIT_PRODUCT_ENABLED=${INV_BUILDKIT_PRODUCT_ENABLED:-0}
    volumes:
      - type: volume
        source: api_config
        target: /run/saintvision
        read_only: true
        volume:
          nocopy: true
      - type: volume
        source: worker_config
        target: /run/saintvision-worker
        read_only: true
        volume:
          nocopy: true
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - saintvision-net

  postgres:
    image: postgres:16-alpine
    container_name: saintvision-postgres
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      - POSTGRES_DB=saintvision
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?Set a unique PostgreSQL administrator password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./deploy/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d saintvision"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    networks:
      - saintvision-net

  minio:
    image: minio/minio:RELEASE.2024-05-10T01-41-38Z
    container_name: saintvision-minio
    command: server /data --console-address ":9001"
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:?Set the deployment storage administrator}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:?Set a unique storage administrator password}
    volumes:
      - minio_data:/data
    restart: unless-stopped
    networks:
      - saintvision-net

volumes:
  api_config:
    external: true
    name: ${INV_CONFIG_VOLUME:?Prepare a private server configuration volume first}
  worker_config:
    external: true
    name: ${INV_WORKER_CONFIG_VOLUME:?Prepare a private worker configuration volume first}
  postgres_data:
  minio_data:

networks:
  saintvision-net:
    driver: bridge
