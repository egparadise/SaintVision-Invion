version: '3.8'

services:
  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    container_name: saintvision-web
    ports:
      - "8443:443"
      - "8081:80"
    volumes:
      - ./deploy/certs/saintvision.crt:/etc/ssl/certs/saintvision.crt:ro
      - ./deploy/certs/saintvision.key:/etc/ssl/private/saintvision.key:ro
    depends_on:
      control-plane:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - saintvision-net

  control-plane:
    build:
      context: .
      dockerfile: deploy/Dockerfile.backend
    container_name: saintvision-control-plane
    ports:
      - "8080:8080"
    environment:
      - INV_DATABASE_URL=postgresql://inv_app:apptestonly@postgres:5432/saintvision
      - PORT=8080
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/v1/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    depends_on:
      - postgres
    restart: unless-stopped
    networks:
      - saintvision-net

  postgres:
    image: postgres:16-alpine
    container_name: saintvision-postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=saintvision
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./deploy/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d saintvision"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    networks:
      - saintvision-net

  minio:
    image: minio/minio:RELEASE.2024-05-10T01-41-38Z
    container_name: saintvision-minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=saintadmin
      - MINIO_ROOT_PASSWORD=saintvision_secure_storage_2026
    volumes:
      - minio_data:/data
    restart: unless-stopped
    networks:
      - saintvision-net

volumes:
  postgres_data:
  minio_data:

networks:
  saintvision-net:
    driver: bridge
