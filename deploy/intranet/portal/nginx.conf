# SaintVision Intranet Portal Nginx Configuration (Card 156)
# Security baseline: Non-root execution, read-only rootfs compatible, HTTPS-only, TLS 1.2+, HSTS, Strict CSP

# Run in foreground inside container
daemon off;

# Non-root user environment: write PID to /tmp instead of /var/run
pid /tmp/nginx.pid;

# Worker configuration
worker_processes auto;
worker_rlimit_nofile 4096;

events {
    worker_connections 1024;
    multi_accept on;
    use epoll;
}

http {
    # MIME types
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Temp paths inside /tmp for read-only rootfs compatibility
    client_body_temp_path /tmp/client_temp 1 2;
    proxy_temp_path       /tmp/proxy_temp_path 1 2;
    fastcgi_temp_path     /tmp/fastcgi_temp 1 2;
    uwsgi_temp_path       /tmp/uwsgi_temp 1 2;
    scgi_temp_path        /tmp/scgi_temp 1 2;

    # Logging to stdout/stderr for container logging
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /dev/stdout main;
    error_log /dev/stderr warn;

    # Performance
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off;

    # Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # Global Security Headers
    # HSTS: 1 year, include subdomains
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    # Content Security Policy (connect-src restricted strictly to https://idp.sv.lan and https://cp.sv.lan)
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src https://idp.sv.lan https://cp.sv.lan; frame-ancestors 'none'; object-src 'none'; base-uri 'self';" always;
    # MIME sniffing protection
    add_header X-Content-Type-Options "nosniff" always;
    # Clickjacking protection
    add_header X-Frame-Options "DENY" always;
    # Referrer policy
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # Feature / Permissions policy
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;

    # HTTP Server (Port 80) -> Immediate 301 Redirect to HTTPS (Port 443)
    server {
        listen 80;
        listen [::]:80;
        server_name portal.sv.lan;

        # Health check endpoint for container orchestrators (optional HTTP probe)
        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 'OK';
        }

        # Redirect all other traffic to HTTPS
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # HTTPS Server (Port 443) - Portal Application
    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        server_name portal.sv.lan;

        # TLS Certificates (mounted read-only)
        ssl_certificate /etc/nginx/certs/portal.crt;
        ssl_certificate_key /etc/nginx/certs/portal.key;

        # TLS Protocol Restrictions: TLS 1.2 and TLS 1.3 only (SSLv3, TLS 1.0, TLS 1.1 disabled)
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;

        # Session parameters
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        # Web Root Directory
        root /usr/share/nginx/html;
        index index.html;

        # Live Health Check
        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 'OK';
        }

        # Runtime OIDC / OAuth Configuration
        # Must not be cached so operator changes to issuer/clientId take immediate effect
        location = /auth-config.js {
            add_header Cache-Control "no-cache, no-store, must-revalidate" always;
            add_header Pragma "no-cache" always;
            add_header Expires "0" always;
            try_files /auth-config.js =404;
        }

        # HTML Entry Point
        # Must not be cached to ensure new deployments / script hashes are fetched immediately
        location = /index.html {
            add_header Cache-Control "no-cache, no-store, must-revalidate" always;
            add_header Pragma "no-cache" always;
            add_header Expires "0" always;
        }

        # Static Assets with Hash in filename (Vite builds into /assets/)
        # Safe to cache immutably for 1 year
        location /assets/ {
            expires 1y;
            add_header Cache-Control "public, immutable" always;
            try_files $uri =404;
        }

        # SPA Fallback: Any unknown route serves index.html
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
