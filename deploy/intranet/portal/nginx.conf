# SaintVision Intranet Portal Nginx Configuration (Card 156)
# Security baseline: Non-root execution, read-only rootfs compatible, HTTPS-only, TLS 1.2+, HSTS, Strict CSP
# Reverse proxy topology: Same-origin /v1/ API, SSE, and Terminal WebSocket forwarded to upstream Control Plane

# Non-root user environment: write PID to /tmp instead of /var/run
pid /tmp/nginx.pid;

# Worker configuration
worker_processes auto;
worker_rlimit_nofile 4096;

events {
    worker_connections 1024;
    multi_accept on;
    use epoll;
}

http {
    # MIME types
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Include upstream control plane definition
    include /etc/nginx/conf.d/upstream.conf;

    # Temp paths inside /tmp for read-only rootfs compatibility
    client_body_temp_path /tmp/client_temp 1 2;
    proxy_temp_path       /tmp/proxy_temp_path 1 2;
    fastcgi_temp_path     /tmp/fastcgi_temp 1 2;
    uwsgi_temp_path       /tmp/uwsgi_temp 1 2;
    scgi_temp_path        /tmp/scgi_temp 1 2;

    # Privacy-preserving logging:
    # NEVER log query strings or Referer to protect one-time OAuth callback codes and session state
    log_format privacy '$remote_addr [$time_local] "$request_method $uri $server_protocol" '
                       '$status $body_bytes_sent';
    access_log /dev/stdout privacy;
    error_log /dev/stderr warn;

    # Performance
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off;

    # Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # Upstream WebSocket connection upgrade mapping
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # HTTP Server (Port 80) -> Immediate 301 Redirect to fixed domain HTTPS
    server {
        listen 80;
        listen [::]:80;
        server_name portal.sv.lan;

        # Health check endpoint for internal container/node liveness probes
        # Allows loopback probes without TLS handshake overhead (contract documented in README)
        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 'OK';
        }

        # Redirect all other traffic strictly to fixed domain HTTPS
        location / {
            return 301 https://portal.sv.lan$request_uri;
        }
    }

    # HTTPS Server (Port 443) - Portal Application & Reverse Proxy
    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        server_name portal.sv.lan;

        # TLS Certificates (mounted read-only)
        ssl_certificate /etc/nginx/certs/portal.crt;
        ssl_certificate_key /etc/nginx/certs/portal.key;

        # TLS Protocol Restrictions: TLS 1.2 and TLS 1.3 only
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;

        # Session parameters
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        # Include standard intranet security headers snippet (HSTS, CSP, nosniff, etc.)
        include /etc/nginx/security-headers.conf;

        # Web Root Directory
        root /usr/share/nginx/html;
        index index.html;

        # Live Health Check
        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 'OK';
        }

        # OAuth Callback Endpoint: never write single-use codes to access log
        location = /callback {
            access_log off;
            root /usr/share/nginx/html;
            try_files /index.html =404;
            include /etc/nginx/security-headers.conf;
            add_header Cache-Control "no-store" always;
        }

        # Runtime OIDC / OAuth Configuration
        # Must not be cached so operator changes to issuer/clientId take immediate effect
        location = /auth-config.js {
            root /usr/share/nginx/html;
            include /etc/nginx/security-headers.conf;
            add_header Cache-Control "no-cache, no-store, must-revalidate" always;
            add_header Pragma "no-cache" always;
            add_header Expires "0" always;
            try_files /auth-config.js =404;
        }

        # HTML Entry Point
        # Must not be cached to ensure new deployments / script hashes are fetched immediately
        location = /index.html {
            root /usr/share/nginx/html;
            include /etc/nginx/security-headers.conf;
            add_header Cache-Control "no-cache, no-store, must-revalidate" always;
            add_header Pragma "no-cache" always;
            add_header Expires "0" always;
        }

        # Static Assets with Hash in filename (Vite builds into /assets/)
        # ^~ modifier prevents later regular expression locations from overriding this prefix match
        # Safe to cache immutably for 1 year
        location ^~ /assets/ {
            root /usr/share/nginx/html;
            expires 1y;
            include /etc/nginx/security-headers.conf;
            add_header Cache-Control "public, immutable" always;
            try_files $uri =404;
        }

        # Missing static files with known file extensions must return 404 instead of SPA fallback
        location ~* \.(?:ico|css|js|gif|jpe?g|png|svg|woff2?|eot|ttf|json|map|wasm)$ {
            root /usr/share/nginx/html;
            include /etc/nginx/security-headers.conf;
            try_files $uri =404;
        }

        # SSE Streaming Endpoints: Buffering disabled, long read timeout
        location ~ ^/v1/projects/[^/]+/runs/[^/]+/events {
            proxy_pass https://control_plane;
            proxy_ssl_verify on;
            proxy_ssl_trusted_certificate /etc/nginx/certs/ca-bundle.crt;
            proxy_ssl_name cp.sv.lan;
            proxy_ssl_server_name on;
            proxy_http_version 1.1;
            proxy_set_header Connection '';
            proxy_set_header Host cp.sv.lan;
            proxy_buffering off;
            proxy_cache off;
            chunked_transfer_encoding off;
            proxy_read_timeout 24h;
            include /etc/nginx/security-headers.conf;
        }

        # WebSocket Terminal Endpoints: HTTP/1.1 Upgrade
        location /v1/terminal/ws {
            proxy_pass https://control_plane;
            proxy_ssl_verify on;
            proxy_ssl_trusted_certificate /etc/nginx/certs/ca-bundle.crt;
            proxy_ssl_name cp.sv.lan;
            proxy_ssl_server_name on;
            proxy_http_version 1.1;
            proxy_set_header Host cp.sv.lan;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 3600s;
            include /etc/nginx/security-headers.conf;
        }

        location ~ ^/v1/workspaces/[^/]+/terminals/ {
            proxy_pass https://control_plane;
            proxy_ssl_verify on;
            proxy_ssl_trusted_certificate /etc/nginx/certs/ca-bundle.crt;
            proxy_ssl_name cp.sv.lan;
            proxy_ssl_server_name on;
            proxy_http_version 1.1;
            proxy_set_header Host cp.sv.lan;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 3600s;
            include /etc/nginx/security-headers.conf;
        }

        # REST API Gateway Reverse Proxy: /v1/ forwarded to upstream Control Plane
        # Connection "" enables upstream HTTP/1.1 keepalive connection pooling
        location /v1/ {
            proxy_pass https://control_plane;
            proxy_ssl_verify on;
            proxy_ssl_trusted_certificate /etc/nginx/certs/ca-bundle.crt;
            proxy_ssl_name cp.sv.lan;
            proxy_ssl_server_name on;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host cp.sv.lan;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_cache off;
            include /etc/nginx/security-headers.conf;
        }

        # SPA Fallback: Any other route serves index.html
        location / {
            root /usr/share/nginx/html;
            try_files $uri $uri/ /index.html;
            include /etc/nginx/security-headers.conf;
        }
    }
}
