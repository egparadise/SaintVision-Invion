# Security Headers Snippet (Card 156)
# Standard Intranet Security Headers
# In Nginx 1.27, declaring add_header in a location block overrides all parent add_header directives.
# Therefore, this file MUST be included in the server block AND in every location block that defines custom headers.

# HSTS: 1 year, include subdomains
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

# Content Security Policy (CSP):
# connect-src restricted strictly to 'self' (same-origin API/SSE/WS reverse proxy) and https://idp.sv.lan (Keycloak OIDC token endpoint)
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self' data:; connect-src 'self' https://idp.sv.lan; frame-ancestors 'none'; object-src 'none'; base-uri 'self'; form-action 'self';" always;

# MIME sniffing protection
add_header X-Content-Type-Options "nosniff" always;

# Clickjacking protection
add_header X-Frame-Options "DENY" always;

# Disable buggy legacy XSS auditor
add_header X-XSS-Protection "0" always;

# Referrer policy
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# Feature / Permissions policy
add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;
