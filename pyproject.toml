[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "saintvision-inv"
version = "0.1.0"
description = "Saint Vision INV Control Plane"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "pydantic",
    "sqlalchemy",
    "alembic",
    "psycopg[binary]",
    "uvicorn",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "services/control-plane/src", "tests"]
# Host Docker mutations are an explicit lane, including on machines with a CLI.
# Select with -m docker_host; marker selection on the command line overrides this.
addopts = "-ra -m 'not docker_host'"
markers = [
    "docker_host: real Docker host operations; explicit isolated-host lane (-m docker_host)",
    "postgres: requires a live PostgreSQL instance (INV_TEST_DATABASE_URL or isolated PG)",
    "credential_model: synthetic conformance model and deliberately faulty models, not backend acceptance",
    "credential_backend: implementation-owned real credential backend conformance, synthetic credentials only",
]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.isort]
profile = "black"
line_length = 100
