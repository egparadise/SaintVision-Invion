[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "saintvision-inv"
version = "0.1.0"
description = "Saint Vision INV Control Plane"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "pydantic",
    "sqlalchemy",
    "alembic",
    "psycopg[binary]",
    "uvicorn",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "services/control-plane/src", "tests"]
addopts = "-ra"
markers = [
    "postgres: requires a live PostgreSQL instance (INV_TEST_DATABASE_URL or isolated PG)",
]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.isort]
profile = "black"
line_length = 100
