name: AC-11 Security Critical High Scan
# Only a dispatch that passes `correlation_id` changes this; every other event keeps
# the workflow name. The value is used for the run's display name only.
run-name: ${{ inputs.correlation_id || github.workflow }}

on:
  workflow_dispatch:
    inputs:
      correlation_id:
        # Opaque id echoed into the run name, and read nowhere else, so a tool that
        # dispatched this run can recognise it among runs other people dispatched at
        # the same ref and commit (tools/post_landing_verify.py). The run list gives
        # no link between a dispatch and the run it creates, and run ids and
        # timestamps cannot tell two concurrent dispatches apart.
        description: 'Opaque id for a tool to bind this exact run; leave empty for a normal manual run'
        required: false
        default: ''
  pull_request:
    types: [labeled, synchronize, reopened]

permissions:
  contents: read

jobs:
  security-critical-high:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.pull_request.labels.*.name, 'run-ac11-security')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: ac11-security-${{ github.event.pull_request.head.sha || github.sha }}
      cancel-in-progress: false
    # SEC-DEF-001 and SEC-RLS-001 are catalogue and row-visibility observations, so this lane
    # needs a database.  It is a service container the collectors create a *disposable migrated*
    # database inside and drop afterwards -- no operational DSN is reachable from here and the
    # password below is this runner's throwaway.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: inv_test_only
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      INV_TEST_ADMIN_DSN: postgresql://postgres:inv_test_only@127.0.0.1:5432/postgres
      SOURCE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      REPORT: evidence/s11-ac11-security-scan.json
      JUNIT: evidence/s11-ac11-security-scan.xml
      PIP_AUDIT_JSON: /tmp/s11-pip-audit.json
      BANDIT_JSON: /tmp/s11-bandit.json
      PIP_AUDIT_VERSION: '2.10.1'
      BANDIT_VERSION: '1.9.4'
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_HEAD_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install pinned scanners
        run: >-
          python -m pip install
          pip-audit==${PIP_AUDIT_VERSION}
          bandit==${BANDIT_VERSION}

      - name: Run complete registered scanner set
        id: scan
        shell: bash
        run: |
          echo "started_at=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"
          echo "pip_audit_version=$(python -m pip_audit --version | awk 'NR==1 {print $2}')" >> "$GITHUB_OUTPUT"
          echo "bandit_version=$(python -m bandit --version | awk 'NR==1 {print $2}')" >> "$GITHUB_OUTPUT"
          set +e
          python -m pip_audit \
            --requirement requirements-core.txt \
            --format json \
            --output "$PIP_AUDIT_JSON"
          pip_audit_exit=$?
          python -m bandit \
            --recursive services/control-plane/src src/saintvision \
            --format json \
            --output "$BANDIT_JSON"
          bandit_exit=$?
          set -e
          echo "pip_audit_exit=$pip_audit_exit" >> "$GITHUB_OUTPUT"
          echo "bandit_exit=$bandit_exit" >> "$GITHUB_OUTPUT"

      - name: Normalize redacted fixed-SHA report
        id: normalize
        shell: bash
        run: |
          set +e
          python tools/run_ac11_security_scan.py \
            --source-run-id "${{ github.run_id }}" \
            --source-head-sha "$SOURCE_HEAD_SHA" \
            --runner-image "${{ runner.os }}-${{ runner.arch }}" \
            --pip-audit-json "$PIP_AUDIT_JSON" \
            --bandit-json "$BANDIT_JSON" \
            --pip-audit-exit "${{ steps.scan.outputs.pip_audit_exit }}" \
            --bandit-exit "${{ steps.scan.outputs.bandit_exit }}" \
            --pip-audit-version "${{ steps.scan.outputs.pip_audit_version }}" \
            --bandit-version "${{ steps.scan.outputs.bandit_version }}" \
            --scan-started-at "${{ steps.scan.outputs.started_at }}" \
            --report "$REPORT" \
            --junit "$JUNIT"
          producer_exit=$?
          set -e
          echo "producer_exit=$producer_exit" >> "$GITHUB_OUTPUT"

      - name: Install database boundary dependencies
        run: python -m pip install -r requirements-test.txt

      - name: Measure the two database threat reports
        id: threats
        shell: bash
        run: |
          # The reports are written whichever way the measurement comes out: NOT_OBSERVED and
          # MEASURED_FAIL are answers, and an unavailable observation is recorded as unavailable
          # rather than dropped.  So this step does not fail the lane -- the gate at the end
          # still enforces the dependency/SAST producer's own exit code.
          set +e
          python tools/run_ac11_security_threat_reports.py \
            --source-run-id "${{ github.run_id }}" \
            --source-head-sha "$SOURCE_HEAD_SHA" \
            --output-dir evidence
          echo "producer_exit=$?" >> "$GITHUB_OUTPUT"
          set -e

      - name: Validate redacted evidence shape
        if: always()
        run: |
          python - <<'PY'
          import json
          import os
          import xml.etree.ElementTree as ET
          from pathlib import Path

          report_path = Path(os.environ['REPORT'])
          junit_path = Path(os.environ['JUNIT'])
          assert report_path.is_file(), 'missing security scan JSON'
          assert junit_path.is_file(), 'missing security scan JUnit'
          report = json.loads(report_path.read_text(encoding='utf-8'))
          assert report['sourceHeadSha'] == os.environ['SOURCE_HEAD_SHA']
          assert report['cleanCheckout'] is True
          assert report['environment']['credentialsRequired'] is False
          assert report['environment']['externalServicesRequired'] is True
          assert set(report['payload']) == {
              'scannerVersions', 'scannerExitCodes', 'scanInputs', 'summaries',
              'auditedDependencies', 'scannedPythonFiles',
              'criticalHighFindings', 'criticalCount', 'highCount',
              'unallowlistedFindingIds', 'expiredFindingIds',
              'staleAllowlistFindingIds', 'severityMismatchFindingIds',
          }
          forbidden_keys = {'description', 'issue_text', 'more_info', 'password', 'token', 'secret'}
          def assert_redacted(value):
              if isinstance(value, dict):
                  assert not (set(map(str.lower, value)) & forbidden_keys), 'unredacted field in evidence'
                  for nested in value.values():
                      assert_redacted(nested)
              elif isinstance(value, list):
                  for nested in value:
                      assert_redacted(nested)
          assert_redacted(report)
          root = ET.parse(junit_path).getroot()
          assert root.attrib['tests'] == '4'

          # The two database threat reports travel in the same artifact as the scan, so they
          # are held to the same provenance and the same redaction.
          for member, threat_id in (
              ('s11-ac11-security-definer.json', 'SEC-DEF-001'),
              ('s11-ac11-security-rls.json', 'SEC-RLS-001'),
          ):
              path = report_path.parent / member
              assert path.is_file(), f'missing {member}'
              document = json.loads(path.read_text(encoding='utf-8'))
              assert document['threatId'] == threat_id
              assert document['sourceHeadSha'] == os.environ['SOURCE_HEAD_SHA']
              assert document['sourceRunId'] == report['sourceRunId']
              assert isinstance(document['exitCode'], int)
              assert document['toolFiles'], 'a threat report must pin the tools that ran'
              assert_redacted(document)
              text = path.read_text(encoding='utf-8')
              for secret in ('inv_test_only', 'postgresql://', 'password='):
                  assert secret not in text, f'{member} carries connection material'
          PY

      - name: Upload AC-11 security evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: s11-ac11-security-${{ env.SOURCE_HEAD_SHA }}
          path: evidence/
          if-no-files-found: error
          retention-days: 30

      - name: Enforce critical/high gate after artifact upload
        if: always()
        shell: bash
        run: test "${{ steps.normalize.outputs.producer_exit }}" = '0'
