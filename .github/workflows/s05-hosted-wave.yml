name: S05 Hosted Placement Wave
on:
  workflow_dispatch:
  pull_request:
    types:
      - labeled
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  s05-hosted-wave:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.label.name == 'run-s05-wave'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: inv_test_only
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      INV_TEST_ADMIN_DSN: postgresql://postgres:inv_test_only@127.0.0.1:5432/postgres
      INV_EVIDENCE_CODE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          # pull_request's default checkout is a synthetic merge SHA. Evidence
          # must identify the reviewed PR head instead.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-test.txt
      - name: Install focused benchmark dependencies
        run: python -m pip install -r requirements-test.txt
      - name: Run legacy and candidate-B waves sequentially
        run: python tools/run_s05_hosted_wave.py --output-dir dist/s05-hosted-wave
      - name: Upload S05 hosted wave evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: saintvision-s05-hosted-wave-${{ github.run_id }}
          path: dist/s05-hosted-wave
          if-no-files-found: error
          retention-days: 14
