name: Auth and Desktop HTTP Browser Acceptance
on:
  push:
    branches:
      - main
      - integration/all-agents-unified
  pull_request:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_name != 'main' }}
permissions:
  contents: read
jobs:
  desktop-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: python -m pip install -r requirements-backend.txt playwright==1.62.0
      - run: python -m playwright install --with-deps chromium
      - run: npm ci --ignore-scripts
        working-directory: apps/web
      - name: Build frontend assets and owned proxy test image
        working-directory: apps/web
        run: |
          npm run build
          mkdir -p ../../.work/web-container-image/dist
          cp -R dist/. ../../.work/web-container-image/dist/
          cp nginx.conf ../../.work/web-container-image/nginx.conf
          cat > ../../.work/web-container-image/Dockerfile <<'EOF'
          FROM nginx:1.27-alpine
          COPY dist/ /usr/share/nginx/html/
          COPY nginx.conf /etc/nginx/nginx.conf
          EOF
          docker build --pull -t "inv-web-test:${GITHUB_SHA}" ../../.work/web-container-image
          echo "INV_WEB_IMAGE=$(docker image inspect --format '{{.Id}}' "inv-web-test:${GITHUB_SHA}")" >> "$GITHUB_ENV"
      - name: Real browser, canonical HTTP and disposable PostgreSQL
        env:
          VF_BROWSER_TEST: '1'
          VF_EVIDENCE_PREFIX: vf-desktop-browser-ci
        run: python tools/run_vf_security_tests.py tests/integration/test_desktop_browser.py tests/integration/test_approval_browser.py tests/integration/test_studio_browser.py
      - name: Require every canonical browser journey to execute
        run: |
          python - <<'PY'
          import json, re
          from pathlib import Path
          proof = json.loads(Path('.work/vf-desktop-browser-ci.json').read_text())
          assert proof['browserOptIn'] and proof['exitCode'] == 0
          assert proof['subprocessExitCode'] == 0 and proof['evidenceStatus'] == 'complete'
          counts = proof['tests']
          assert counts['passed'] > 0 and all(counts[key] == 0 for key in ('failure', 'error', 'skipped'))
          assert proof['isolatedContainerRemoved']
          cases = json.loads(Path(proof['xmlPath']).with_name('case-identities-private.json').read_text())
          journeys = {re.sub(r'\[.*\]$', '', case['name']) for case in cases}
          expected = {
              'test_actual_browser_quorum_snapshot_and_no_duplicate_vote',
              'test_actual_browser_stale_run_and_revoked_review_are_rejected',
              'test_browser_real_catalogue_owner_scope_and_revocation',
              'test_browser_real_committed_model_and_current_permission',
              'test_full_studio_login_project_approval_and_logout',
          }
          assert journeys == expected, f'browser journey set drifted: {journeys ^ expected}'
          PY
      - name: Test built frontend proxy image and TLS boundary
        run: python -m pytest -q --strict-markers tests/integration/test_web_container.py --junitxml=.work/web-container-tests.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-browser-safe-evidence
          path: |
            .work/vf-desktop-browser-ci.json
            .work/web-container-tests.xml
            .work/web-container-studio.png
          retention-days: 14
