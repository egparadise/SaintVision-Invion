name: Desktop HTTP Browser Acceptance
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  desktop-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: python -m pip install -r requirements-backend.txt playwright==1.62.0
      - run: python -m playwright install --with-deps chromium
      - run: npm ci --ignore-scripts
        working-directory: apps/web
      - name: Real browser, canonical HTTP and disposable PostgreSQL
        env:
          VF_BROWSER_TEST: '1'
          VF_EVIDENCE_PREFIX: vf-desktop-browser-ci
        run: python tools/run_vf_security_tests.py tests/integration/test_desktop_browser.py
      - name: Require both browser journeys to execute
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          proof = json.loads(Path('.work/vf-desktop-browser-ci.json').read_text())
          assert proof['browserOptIn'] and proof['exitCode'] == 0
          assert proof['tests'] == {'failure': 0, 'error': 0, 'skipped': 0, 'passed': 2}
          assert proof['isolatedContainerRemoved']
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-browser-safe-evidence
          path: .work/vf-desktop-browser-ci.json
          retention-days: 14
