name: Documentation Build
on:
  workflow_dispatch:
  push:
    branches:
      - main
      - integration/all-agents-unified
  pull_request:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Keep shared evidence branches ordered, but let a PR merge ref or a manually
  # dispatched agent branch replace its own stale run.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/integration/all-agents-unified' }}
permissions:
  contents: read
env:
  PYTHONUTF8: '1'
jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-docs.txt
      - run: python -m pip install -r requirements-docs.txt
      - run: python tools/check_docs.py
      - run: python tools/check_contract_bindings.py
      - run: python tools/check_frontend_integrity.py
      - name: Report fixture producer reachability
        continue-on-error: true
        shell: bash
        run: |
          python tools/check_fixture_reachability.py | tee fixture-reachability.txt
          cat fixture-reachability.txt >> "$GITHUB_STEP_SUMMARY"
      - name: Report client route coverage (report-only; promote per 검증검사도구_목록)
        # Which /v1 paths the SPA asks for and which nothing serves. Introduced
        # 2026-09-22 as report-only: exit code is recorded, never blocks the job.
        # Promotion to ratchet requires one week green and backlog 0.
        continue-on-error: true
        shell: bash
        run: |
          set +e
          python tools/route_coverage.py --served src --served services/control-plane/src             --client apps/web/src --json > route-coverage.json
          rc=$?
          python tools/route_coverage.py --served src --served services/control-plane/src             --client apps/web/src > route-coverage.txt
          {
            echo "## Client route coverage (report-only, exit=$rc)"
            echo '```'
            cat route-coverage.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "route_coverage exit=$rc (0=all served, 1=unserved paths, 2=no client paths)"
          exit 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: route-coverage-report
          path: |
            route-coverage.json
            route-coverage.txt
          retention-days: 30
      - run: python tools/test_sync.py
      - run: python tools/check_ontology_generation.py
      - run: python tools/check_ontology.py
      - name: Build documentation bundle
        run: python tools/build_docs.py
      - uses: actions/upload-artifact@v4
        with:
          name: saintvision-guidelines
          path: dist/saintvision-guidelines.zip
          retention-days: 30
