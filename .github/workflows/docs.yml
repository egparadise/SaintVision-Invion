name: Documentation Build
on:
  workflow_dispatch:
  push:
    branches:
      - main
      - integration/all-agents-unified
  pull_request:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Keep shared evidence branches ordered, but let a PR merge ref or a manually
  # dispatched agent branch replace its own stale run.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/integration/all-agents-unified' }}
permissions:
  contents: read
env:
  PYTHONUTF8: '1'
jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-docs.txt
      - run: python -m pip install -r requirements-docs.txt
      - run: python tools/check_docs.py
      - name: Repository path citations exist (ratchet; baseline may only shrink)
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          # The floor is the baseline at the base commit. Each trigger names its
          # base explicitly; none of them guesses from the previous commit (a multi-commit push
          # could raise the floor in commit 1 and hide it behind commit 2).
          case "$EVENT_NAME" in
            pull_request)
              git fetch --no-tags --depth=1 origin "$GITHUB_BASE_REF"
              base="origin/$GITHUB_BASE_REF"
              ;;
            push)
              # The commit the branch pointed at before this push (all of the
              # pushed commits are compared against it). A zero SHA means the
              # branch is new: fail closed rather than invent a floor.
              if [ -z "$PUSH_BEFORE" ] || [ "$PUSH_BEFORE" = "0000000000000000000000000000000000000000" ]; then
                echo "FAIL: push without a previous commit (new branch); no baseline floor to compare against" >&2
                exit 1
              fi
              git fetch --no-tags --depth=1 origin "$PUSH_BEFORE"
              git rev-parse --verify --quiet "$PUSH_BEFORE^{commit}" >/dev/null
              base="$PUSH_BEFORE"
              ;;
            *)
              # workflow_dispatch: a manual run has no base to ratchet against.
              # It checks current consistency only (new/stale entries), and says so.
              echo "manual run: floor check is against HEAD itself (consistency only)"
              base="HEAD"
              ;;
          esac
          python tools/check_doc_path_citations.py --ratchet --base-ref "$base"
      - run: python tools/check_contract_bindings.py
      - run: python tools/check_frontend_integrity.py
      - name: Report fixture producer reachability
        continue-on-error: true
        shell: bash
        run: |
          python tools/check_fixture_reachability.py | tee fixture-reachability.txt
          cat fixture-reachability.txt >> "$GITHUB_STEP_SUMMARY"
      - name: Report client route coverage (report-only; promote per 검증검사도구_목록)
        # Which /v1 paths the SPA asks for and which nothing serves. Introduced
        # 2026-09-22 as report-only: exit code is recorded, never blocks the job.
        # Promotion to ratchet requires one week green and backlog 0.
        continue-on-error: true
        shell: bash
        run: |
          set +e
          python tools/route_coverage.py --served src --served services/control-plane/src             --client apps/web/src --json > route-coverage.json
          rc=$?
          python tools/route_coverage.py --served src --served services/control-plane/src             --client apps/web/src > route-coverage.txt
          {
            echo "## Client route coverage (report-only, exit=$rc)"
            echo '```'
            cat route-coverage.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "route_coverage exit=$rc (0=all served, 1=unserved paths, 2=no client paths)"
          exit 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: route-coverage-report
          path: |
            route-coverage.json
            route-coverage.txt
          retention-days: 30
      - run: python tools/test_sync.py
      - run: python tools/check_ontology_generation.py
      - run: python tools/check_ontology.py
      - name: Build documentation bundle
        run: python tools/build_docs.py
      - uses: actions/upload-artifact@v4
        with:
          name: saintvision-guidelines
          path: dist/saintvision-guidelines.zip
          retention-days: 30
