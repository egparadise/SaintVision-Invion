name: Documentation Build
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-docs.txt
      - run: python -m pip install -r requirements-docs.txt
      - run: python tools/check_docs.py
      - run: python tools/test_sync.py
        if: github.head_ref != 'agent/codex/workspace-bridge' && github.ref_name != 'agent/codex/workspace-bridge'
      - run: python tools/check_ontology.py
      - name: Build documentation bundle
        run: python tools/build_docs.py
      - uses: actions/upload-artifact@v4
        with:
          name: saintvision-guidelines
          path: dist/saintvision-guidelines.zip
          retention-days: 30
