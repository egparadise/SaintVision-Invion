name: Documentation Build
on:
  push:
    branches:
      - main
      - integration/all-agents-unified
  pull_request:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_name != 'main' }}
permissions:
  contents: read
jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-docs.txt
      - run: python -m pip install -r requirements-docs.txt
      - run: python tools/check_docs.py
      - run: python tools/check_contract_bindings.py
      - run: python tools/check_frontend_integrity.py
      - run: python tools/test_sync.py
      - run: python tools/check_ontology.py
      - name: Build documentation bundle
        run: python tools/build_docs.py
      - uses: actions/upload-artifact@v4
        with:
          name: saintvision-guidelines
          path: dist/saintvision-guidelines.zip
          retention-days: 30
