name: S12 Acceptance Evidence
# Only a dispatch that passes `correlation_id` changes this; every other event keeps the
# workflow name. The value is used for the run's display name only.
run-name: ${{ inputs.correlation_id || github.workflow }}

# `workflow_dispatch` and a labelled pull request, and deliberately **no push trigger**.
# A workflow that triggered on a push to integration/all-agents-unified would owe a lane in
# tools/post_landing_verify.py -- the reverse ratchet in tests/core/test_post_landing_verify.py
# asserts exactly that -- and this bundle is not a landing gate. It is the collector being
# run by CI instead of by a person, which is a thing to do on request, not on every landing.
on:
  workflow_dispatch:
    inputs:
      correlation_id:
        description: 'Opaque id for a tool to bind this exact run; leave empty for a normal manual run'
        required: false
        default: ''
  pull_request:
    types: [opened, labeled, synchronize, reopened]

permissions:
  contents: read

jobs:
  s12-acceptance-evidence:
    # Opt-in on pull requests: this spends a PostgreSQL service and a runner, and the answer
    # only moves when the acceptance tools or their inputs change.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.pull_request.labels.*.name, 'run-s12-acceptance')
    runs-on: ubuntu-latest
    outputs:
      evidence-artifact-id: ${{ steps.evidence-upload.outputs.artifact-id }}
      evidence-artifact-name: s12-acceptance-${{ github.event.pull_request.head.sha || github.sha }}
      evidence-artifact-digest: ${{ steps.evidence-upload.outputs.artifact-digest }}
    timeout-minutes: 20
    concurrency:
      group: s12-acceptance-${{ github.event.pull_request.head.sha || github.sha }}
      cancel-in-progress: false
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: invowner
          POSTGRES_PASSWORD: ci_local_only
          POSTGRES_DB: invdev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U invowner -d invdev"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      SOURCE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      HEAD_REF: ${{ github.event.pull_request.head.ref || github.ref_name }}
      # One database, three names, two spellings. The readiness and PITR tools hand their DSN
      # to `psycopg.connect`, which wants a libpq URL. Alembic hands INV_MIGRATION_DSN to
      # SQLAlchemy, which reads the scheme to choose a driver: `postgresql://` means psycopg2,
      # which this project does not install, and run 36847277078 failed with
      # `ModuleNotFoundError: No module named 'psycopg2'` for exactly that reason. The
      # `+psycopg` spelling is what every other Backend lane in this repository uses.
      INV_MIGRATION_DSN: postgresql+psycopg://invowner:ci_local_only@localhost:5432/invdev
      INV_READINESS_DSN: postgresql://invowner:ci_local_only@localhost:5432/invdev
      INV_PITR_DSN: postgresql://invowner:ci_local_only@localhost:5432/invdev
      OUT_DIR: evidence/s12-acceptance
    steps:
      - name: Checkout the exact source head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          # The collector refuses a head no remote ref contains unless told otherwise, and
          # it reads provenance from history, so a shallow checkout would make it refuse
          # for the wrong reason.
          fetch-depth: 0
      - name: Make the remote ref the reachability check reads
        # The collector refuses a head that no remote ref contains -- evidence nobody can check
        # out is not evidence -- and it measures that with `merge-base --is-ancestor` against a
        # remote-tracking ref whose tip it re-reads with `ls-remote`. The checkout above is by
        # SHA, which need not leave refs/remotes/origin/* behind, so this creates the one ref
        # the check reads. It does not make the check pass: ancestry and live freshness are
        # still measured, and a head that is not on the branch still fails. A fork PR has no
        # such ref on origin and fails here loudly, which is the honest outcome; every lane in
        # this repository pushes its branch to origin.
        run: git fetch --no-tags origin "+refs/heads/$HEAD_REF:refs/remotes/origin/$HEAD_REF"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-test.txt
      - run: python -m pip install -r requirements-test.txt
      - name: Apply the published migrations
        # Without this the readiness tool reads an empty catalogue and every database item
        # becomes the same FAIL for the same uninformative reason. With it, the items that
        # fail do so because an operational input is genuinely absent.
        run: python -m alembic upgrade head
      - name: Create the read-only PITR observation inputs
        # Two empty directories. The rehearsal is a read-only observation, so an empty
        # archive and an empty backup set are a real state to observe -- "no base backup" is
        # the answer, and inventing one would be the failure this collector exists to avoid.
        run: |
          mkdir -p .work/s12/archive .work/s12/backups "$OUT_DIR"
      - name: Derive the AC-12 acceptance items
        # The verdict is not the gate, but a refusal to measure is. The collector's exit code
        # is its verdict: 0 PASS or PASS_MEASURED_PARTIAL, 1 FAIL, 3 NOT_OBSERVED -- all of
        # them answers it reached -- and 2 when it declined to answer at all (dirty tree,
        # unreachable head, no DSN, refusing to overwrite). So 0/1/3 continue to the gate and
        # anything else fails the job.
        #
        # This comment used to say the collector "exits 0 having recorded it", which was wrong:
        # EXIT_BY_VERDICT maps FAIL to 1, and FAIL is today's honest verdict. Run 36851234615
        # derived all seventeen items, wrote the bundle, uploaded it -- and failed here, which
        # skipped the gate. I asserted an exit code from the shape of the tool instead of
        # reading its exit table.
        run: |
          code=0
          python tools/collect_s12_acceptance_evidence.py \
            --tenant 00000000-0000-4000-8000-000000000001 \
            --pitr-archive .work/s12/archive \
            --pitr-backups .work/s12/backups \
            --out-dir "$OUT_DIR" \
            --executor github-actions \
            --reachable-ref "origin/$HEAD_REF" \
            --note "derived by CI at $SOURCE_HEAD_SHA; promotes no score and claims no acceptance" || code=$?
          case "$code" in
            0|1|3) echo "the collector reached a verdict (exit $code); the gate reads the bundle" ;;
            *) echo "the collector declined to measure (exit $code); there is no bundle to judge" >&2
               exit "$code" ;;
          esac
      - name: Hold the bundle to its shape and to this head
        # --expected-head is what makes this a check of *this* run's bundle: the gate requires
        # codeSha, provenance.commit_sha and the file's own name to be this commit, the verdict
        # to be the one the collector's rule produces from these items, every item to name the
        # tool the collector's catalogue names, and the provenance to describe a clean, pushed
        # checkout whose collector digest is the collector in this tree. Without it the gate
        # accepted a hand-written bundle with a verdict nothing emitted and no commit at all.
        run: |
          bundle="$(ls "$OUT_DIR"/*.json | head -1)"
          test -n "$bundle"
          python tools/check_s12_acceptance_shape.py "$bundle" --expected-head "$SOURCE_HEAD_SHA"
      - name: Record that the two named observations were derived here
        # The VF-CL registry's `ciVerifiedNote` said these two were produced by hand and
        # that CI never re-derived them. This step is the line a reader can point at.
        run: |
          bundle="$(ls "$OUT_DIR"/*.json | head -1)"
          python - "$bundle" <<'PY'
          import json, sys
          items = json.load(open(sys.argv[1], encoding="utf-8"))["items"]
          for name in ("pitr-configuration-possible", "pitr-rehearsal-dry-run-observed"):
              item = items[name]
              print(f"{name}: {item['status']} (source {item.get('source')})")
          PY
      - name: Upload the acceptance evidence
        if: always()
        id: evidence-upload
        uses: actions/upload-artifact@v4
        with:
          name: s12-acceptance-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ env.OUT_DIR }}
          if-no-files-found: error

  attest-vf-cl-ci-receipt:
    # PR code never receives an OIDC signing token.  Only an explicit workflow_dispatch
    # reaches this job, after the unprivileged producer completed successfully.
    if: github.event_name == 'workflow_dispatch' && needs.s12-acceptance-evidence.result == 'success'
    needs: s12-acceptance-evidence
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: s12-attestation-${{ github.run_id }}
      cancel-in-progress: false
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
      artifact-metadata: write
    env:
      SOURCE_HEAD_SHA: ${{ github.sha }}
      EVIDENCE_ARTIFACT_ID: ${{ needs.s12-acceptance-evidence.outputs.evidence-artifact-id }}
      EVIDENCE_ARTIFACT_NAME: ${{ needs.s12-acceptance-evidence.outputs.evidence-artifact-name }}
      EVIDENCE_ARTIFACT_DIGEST: ${{ needs.s12-acceptance-evidence.outputs.evidence-artifact-digest }}
      RECEIPT_DIR: .work/vf-cl-attestation
      RECEIPT_PATH: .work/vf-cl-attestation/VF-CL-04.json
    steps:
      - name: Checkout the exact attested source head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download the exact evidence artifact
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ env.EVIDENCE_ARTIFACT_ID }}
          path: .work/s12-evidence-download
      - name: Read current-run artifact metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RECEIPT_DIR"
          gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?name=$EVIDENCE_ARTIFACT_NAME" \
            > "$RECEIPT_DIR/artifacts.json"
      - name: Create the authoritative VF-CL receipt
        run: |
          python tools/create_vf_cl_ci_attestation_receipt.py \
            --artifact-metadata "$RECEIPT_DIR/artifacts.json" \
            --artifact-id "$EVIDENCE_ARTIFACT_ID" \
            --artifact-name "$EVIDENCE_ARTIFACT_NAME" \
            --producer-conclusion '${{ needs.s12-acceptance-evidence.result }}' \
            --required-step 'Derive the AC-12 acceptance items' \
            --required-step 'Hold the bundle to its shape and to this head' \
            --required-step 'Record that the two named observations were derived here' \
            --required-step 'Upload the acceptance evidence' \
            --out "$RECEIPT_PATH"
          test "$(sha256sum "$RECEIPT_PATH" | cut -d' ' -f1)" != ""
          test "$EVIDENCE_ARTIFACT_DIGEST" = "$(python -c \
            'import json,os; print(json.load(open(os.environ["RECEIPT_PATH"]))["evidenceArtifact"]["digest"])')"
      - name: Attest the CI-produced VF-CL receipt
        id: receipt-attestation
        uses: actions/attest@v4
        with:
          subject-path: ${{ env.RECEIPT_PATH }}
      - name: Verify receipt signature, identity, source, and bytes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python tools/verify_vf_cl_ci_attestation.py \
            --receipt "$RECEIPT_PATH" \
            --bundle '${{ steps.receipt-attestation.outputs.bundle-path }}' \
            --expected-head "$SOURCE_HEAD_SHA" \
            --expected-ref "$GITHUB_REF" \
            --output "$RECEIPT_DIR/verification.json"
      - name: Upload the authoritative receipt and Sigstore bundle
        uses: actions/upload-artifact@v4
        with:
          name: vf-cl-ci-attestation-${{ github.sha }}
          path: |
            ${{ env.RECEIPT_PATH }}
            ${{ steps.receipt-attestation.outputs.bundle-path }}
            ${{ env.RECEIPT_DIR }}/verification.json
          if-no-files-found: error
