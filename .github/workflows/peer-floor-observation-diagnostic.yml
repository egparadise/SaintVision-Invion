name: Peer floor observation stage1 diagnostic
run-name: ${{ inputs.correlation_id || github.workflow }}
on:
  workflow_dispatch:
    inputs:
      correlation_id:
        description: 'Exact diagnostic-run correlation; no operational inputs'
        required: true
permissions:
  contents: read
jobs:
  diagnose:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/agent/codex/fleet5-peer-floor-observation-diagnostic-20261106'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      INV_EVIDENCE_CODE_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      # Same toolchains/dependency files as the actual Core workflow. No new
      # dependency or production provider is introduced by this diagnostic lane.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements-test.txt
            requirements-docs.txt
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
          cache: false
      - run: python -m pip install -r requirements-test.txt -r requirements-docs.txt
      - name: Require stage1 guard and redaction unit tests
        run: python -B -m pytest tests/core/test_worker_peer_floor_observation_diagnostics.py tests/core/test_lan_workspace_upgrade.py -q
      - name: Build exact source Node and existing fixture programs
        working-directory: services/node-agent
        run: |
          mkdir -p "$GITHUB_WORKSPACE/dist" "$GITHUB_WORKSPACE/.work/node-image"
          CGO_ENABLED=0 go build -trimpath -o "$GITHUB_WORKSPACE/dist/inv-node" ./cmd/inv-node
          CGO_ENABLED=0 go build -trimpath -o "$GITHUB_WORKSPACE/.work/node-image/probe" ./tests/probe
          CGO_ENABLED=0 go build -trimpath -o "$GITHUB_WORKSPACE/.work/node-image/inv-supervisor" ./cmd/inv-supervisor
      - name: Build existing pinned Python workload fixture
        run: |
          docker pull python:3.12-slim
          python_base=$(docker image inspect --format '{{index .RepoDigests 0}}' python:3.12-slim)
          docker build --pull=false --build-arg "PYTHON_IMAGE=$python_base" -f deploy/testing/Dockerfile.python-node -t "inv-python-node:$GITHUB_SHA" .work/node-image
          echo "INV_PYTHON_NODE_IMAGE=$(docker image inspect --format '{{.Id}}' "inv-python-node:$GITHUB_SHA")" >> "$GITHUB_ENV"
          echo "DIAGNOSTIC_PYTHON_BASE=$python_base" >> "$GITHUB_ENV"
      - name: Build existing owned LAN Node fixture
        run: |
          mkdir -p .work/lan-node-image
          cp dist/inv-node .work/lan-node-image/inv-node
          cp deploy/lan/Dockerfile.node .work/lan-node-image/Dockerfile
          docker build --network=none --pull=false -t "inv-lan-node-test:$GITHUB_SHA" .work/lan-node-image
          echo "INV_UPGRADE_AGENT_IMAGE=$(docker image inspect --format '{{.Id}}' "inv-lan-node-test:$GITHUB_SHA")" >> "$GITHUB_ENV"
      - name: Three predeclared diagnostic samples of the exact failed test
        # ALL three run once regardless of earlier success/failure. This is not
        # a retry-until-pass loop. Any failed/skipped/unknown case keeps this
        # workflow red; captured diagnostics do not authorize acceptance.
        run: |
          python -B - <<'PY'
          import hashlib, json, os, re, subprocess, sys, tempfile
          from pathlib import Path
          import xml.etree.ElementTree as ET

          output = Path('dist/peer-floor-observation-diagnostic')
          output.mkdir(parents=True)
          source = subprocess.check_output(['git', 'rev-parse', 'HEAD']).decode().strip()
          assert source == os.environ['GITHUB_SHA']
          command = [sys.executable, '-B', '-m', 'pytest', '-q',
                     'tests/integration/test_workspace_upgrade.py::test_real_upgrade_preserves_credentials_journal_and_replays',
                     '-o', 'faulthandler_timeout=45']
          allowed_categories = {'CONTAINER_ID_CHANGED','IMAGE_CHANGED','CONFIG_CHANGED','MOUNTS_CHANGED',
              'MOUNTS_ORDER_ONLY','STARTED_AT_CHANGED','RESTART_COUNT_CHANGED','VOLUME_CHANGED',
              'VOLUME_CREATED_AT_FIELD_ONLY','CONSUMERS_CHANGED','UNKNOWN_DIFFERENCE','DIAGNOSTIC_BOUND_EXCEEDED'}
          allowed_top = {'container.Id','container.Image','container.Config','container.Mounts',
                        'container.State.StartedAt','container.RestartCount','volume','volumeConsumers'}
          path_pattern = re.compile(r'(?:container\.(?:Id|Image|Config(?:\.(?:Cmd|Entrypoint|Env|Labels|Image|User|WorkingDir|Hostname|Domainname|Volumes|ExposedPorts|Healthcheck|StopSignal|StopTimeout|Tty|OpenStdin|StdinOnce|Shell|<other>))?|Mounts(?:\[[0-7]\]\.(?:Type|Name|Source|Destination|Driver|Mode|RW|Propagation|<other>))?|State\.StartedAt|RestartCount)|volume(?:\.(?:Name|Driver|Mountpoint|CreatedAt|Scope|Labels|Options|Status|<other>))?|volumeConsumers)')

          def sanitized(value):
              assert value['classification'] == 'REFUSAL_DIAGNOSTIC_ONLY'
              paths = value['changedPaths']; categories = value['categories']; hashes = value['hashes']
              assert len(paths) <= 24 and all(type(p) is str and len(p) <= 72 and path_pattern.fullmatch(p) for p in paths)
              assert len(categories) <= 8 and all(c in allowed_categories for c in categories)
              assert len(hashes) <= 8 and all(k in allowed_top for k in hashes)
              for pair in hashes.values():
                  assert set(pair) == {'beforeSHA256','afterSHA256'}
                  assert all(v is None or type(v) is str and re.fullmatch('[0-9a-f]{64}',v) for v in pair.values())
              assert type(value['truncated']) is bool and value['diagnosticVersion'] == 1
              return dict(diagnosticVersion=1, classification='REFUSAL_DIAGNOSTIC_ONLY', changedPaths=paths,
                          categories=categories, hashes=hashes, truncated=value['truncated'])

          report = dict(classification='STAGE1_DIAGNOSIS_NOT_BEHAVIOUR_FIX_OR_CORE_ACCEPTANCE', sourceSHA=source,
                        runId=os.environ['GITHUB_RUN_ID'], attempt=os.environ['GITHUB_RUN_ATTEMPT'],
                        argv=command, maxSamples=3, samplePurpose='Independent owned fixture executions of exact prior failing test; never retry until pass',
                        pythonBase=os.environ['DIAGNOSTIC_PYTHON_BASE'], samples=[])
          # No INV_TEST_EVIDENCE_DIR: existing test does not publish raw signed
          # records/certificates. No raw pytest output/XML/Config/env is uploaded.
          env = dict(os.environ); env.pop('INV_TEST_EVIDENCE_DIR',None)
          for sample_id in ('OBSERVATION_SAMPLE_1','OBSERVATION_SAMPLE_2','OBSERVATION_SAMPLE_3'):
              with tempfile.TemporaryDirectory(prefix='peer-floor-ci-') as tmp:
                  xml = Path(tmp)/'result.xml'
                  timed_out = False
                  try:
                      result = subprocess.run(command + ['--junitxml='+str(xml)], env=env, capture_output=True, timeout=240)
                      raw = result.stdout + result.stderr; exit_code = result.returncode
                  except subprocess.TimeoutExpired as error:
                      raw = (error.stdout or b'') + (error.stderr or b''); exit_code = 124; timed_out = True
                  diagnostics = []
                  for match in re.finditer(r'; diagnostic=',raw.decode(errors='replace')):
                      try:
                          value,_ = json.JSONDecoder().raw_decode(raw.decode(errors='replace')[match.end():])
                          value = sanitized(value)
                          if value not in diagnostics: diagnostics.append(value)
                      except (ValueError,KeyError,TypeError,AssertionError):
                          pass
                  cases = ET.parse(xml).getroot().findall('.//testcase') if xml.exists() else []
                  counts = {tag:sum(len(c.findall(tag)) for c in cases) for tag in ('failure','error','skipped')}
                  passed = exit_code == 0 and len(cases) == 1 and not any(counts.values())
                  item = dict(sampleId=sample_id,exit=exit_code,timedOut=timed_out,executedCases=len(cases),counts=counts,
                              rawOutputSHA256=hashlib.sha256(raw).hexdigest(),diagnostics=diagnostics[:4],
                              outcome='NOT_REPRODUCED' if passed else 'ACTUAL_GUARD_DIAGNOSTIC_CAPTURED' if diagnostics else 'FAILURE_WITHOUT_SANITIZED_GUARD_CAPTURE',
                              acceptancePassed=passed)
                  report['samples'].append(item)
                  print(json.dumps(item,sort_keys=True))
          report['allExactCaseExecutionsPassed'] = all(s['acceptancePassed'] for s in report['samples'])
          report['originalDe71DifferingField'] = 'UNKNOWN_NOT_RETROACTIVELY_INFERRED'
          (output/'result.json').write_text(json.dumps(report,indent=2)+'\n')
          files = ('worker_config.py','worker_leaf_rotation.py','peer_policy_phase.py','worker_peer_floor.py',
                   'worker_plain_rotation.py','leaf_rotation_standalone_runtime.py','leaf-rotation-runtime-lock.json')
          pins = {name:hashlib.sha256((Path('deploy/lan')/name).read_bytes()).hexdigest() for name in files}
          manifest = dict(classification='NEW_UNREGISTERED_RAW_SEVEN_FILE_CANDIDATE_NOT_INSTALLED_TRUST',sourceSHA=source,files=pins,
                          rawSevenFileCandidateSHA256=hashlib.sha256((json.dumps(pins,sort_keys=True,separators=(',',':'))+'\n').encode()).hexdigest(),
                          binarySHA256=hashlib.sha256(Path('dist/inv-node').read_bytes()).hexdigest())
          (output/'source-manifest.json').write_text(json.dumps(manifest,indent=2)+'\n')
          sys.exit(0 if report['allExactCaseExecutionsPassed'] else 1)
          PY
      - name: Publish sanitized diagnostics and source digests only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: peer-floor-observation-stage1-${{ github.sha }}
          path: dist/peer-floor-observation-diagnostic/
          if-no-files-found: error
          retention-days: 30
