name: Core Build
on:
  workflow_dispatch:
  push:
    branches:
      - main
      - integration/all-agents-unified
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - labeled
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Keep shared evidence branches ordered, but let a PR merge ref or a manually
  # dispatched agent branch replace its own stale run.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/integration/all-agents-unified' }}
permissions:
  contents: read
jobs:
  core:
    # Core owns PostgreSQL, Go race, Docker image and Python integration work.
    # Do not consume a hosted runner for every PR update: opt in with the
    # ``run-core`` label, or choose the branch in workflow_dispatch. Pushes to
    # main/integration are never pull_request events and therefore always run.
    if: >-
      github.event_name != 'pull_request' ||
      contains(github.event.pull_request.labels.*.name, 'run-core')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      INV_TEST_ADMIN_DSN: postgresql://postgres:inv_test_only@127.0.0.1:5432/postgres
      INV_TEST_EVIDENCE_DIR: ${{ github.workspace }}/dist
      MINIO_IMAGE: docker.io/coollabsio/minio@sha256:72b4794d7faa001823364f8ee239717141327fc450a3264414f573a6abf3c629
      MINIO_ROOT_USER: product-store-ci
      MINIO_ROOT_PASSWORD: product-store-ci-only-secret
      INV_OBJECT_STORE_ENDPOINT: http://127.0.0.1:9000
      INV_OBJECT_STORE_BUCKET: saintvision-product-ci
      INV_OBJECT_STORE_ACCESS_KEY_ID: product-store-ci
      INV_OBJECT_STORE_SECRET_ACCESS_KEY: product-store-ci-only-secret
      INV_OBJECT_STORE_REGION: us-east-1
      INV_OBJECT_STORE_TARGET_KIND: ci-candidate
      INV_EVIDENCE_CODE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      # Role-shape rejection tests own a separate disposable cluster. Keep the
      # same explicit image opt-in as Backend Build, but let the normal Core
      # pytest collection execute the cases once instead of adding another
      # focused test step.
      INV_TEST_ROLE_GUARD_IMAGE: postgres:16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements-test.txt
            requirements-docs.txt
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
          cache: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements-test.txt -r requirements-docs.txt
      - name: Start digest-pinned product ObjectStore service
        run: |
          docker pull --platform linux/amd64 "$MINIO_IMAGE"
          docker run --detach --rm --platform linux/amd64 \
            --name saintvision-product-object-store \
            --tmpfs /data:rw,noexec,nosuid,size=128m \
            --publish 127.0.0.1:9000:9000 \
            --env MINIO_ROOT_USER \
            --env MINIO_ROOT_PASSWORD \
            "$MINIO_IMAGE" server /data --address ':9000'
          for attempt in $(seq 1 45); do
            if curl --fail --silent --show-error http://127.0.0.1:9000/minio/health/live > /dev/null; then
              break
            fi
            if test "$attempt" = 45; then
              docker logs saintvision-product-object-store
              exit 1
            fi
            sleep 1
          done
          python - <<'PY'
          import os
          from tools.verify_storage_roundtrip import S3Client, load_config

          response = S3Client(load_config(os.environ)).create_bucket()
          assert response.status == 200, f'redacted product bucket setup failed ({response.status})'
          PY
      - name: Create disposable CX01 PostgreSQL
        run: |
          mkdir -p .work
          cx01_owner="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          cx01_name="sv-cx01-${cx01_owner}"
          docker run -d \
            --cidfile .work/cx01-container-id \
            --name "$cx01_name" \
            --label "ai.saintvision.kernel-test=$cx01_owner" \
            --label "ai.saintvision.cx01=$cx01_owner" \
            --label "ai.saintvision.created-by=github-actions" \
            --tmpfs /var/lib/postgresql/data:rw,noexec,nosuid \
            -e POSTGRES_PASSWORD=inv_test_only \
            -e POSTGRES_DB=postgres \
            -p 127.0.0.1:5432:5432 \
            --health-cmd 'pg_isready -U postgres' \
            --health-interval 2s --health-timeout 2s --health-retries 30 \
            postgres:16
          cx01_id="$(cat .work/cx01-container-id)"
          for attempt in $(seq 1 45); do
            health="$(docker inspect --format '{{.State.Health.Status}}' "$cx01_id")"
            if [ "$health" = healthy ]; then break; fi
            if [ "$(docker inspect --format '{{.State.Running}}' "$cx01_id")" != true ]; then
              docker logs "$cx01_id"
              exit 1
            fi
            sleep 2
          done
          test "$(docker inspect --format '{{.State.Health.Status}}' "$cx01_id")" = healthy
          test "$(docker inspect --format '{{index .Config.Labels "ai.saintvision.kernel-test"}}' "$cx01_id")" = "$cx01_owner"
          test "$(docker inspect --format '{{index .Config.Labels "ai.saintvision.cx01"}}' "$cx01_id")" = "$cx01_owner"
          test "$(docker inspect --format '{{.Name}}' "$cx01_id")" = "/$cx01_name"
          echo "CX01_CONTAINER=$cx01_id" >> "$GITHUB_ENV"
          echo "INV_TEST_ADMIN_DSN=postgresql://postgres:inv_test_only@127.0.0.1:5432/postgres" >> "$GITHUB_ENV"
      - name: Regenerate contracts and detect drift
        run: |
          python tools/generate_contracts.py
          git diff --exit-code -- services/control-plane/src/inv/generated packages/contracts-ts packages/contracts-go services/node-agent/internal/wire/core.schema.json
      - name: Upgrade each published migration head
        run: python tools/check_migration_upgrade.py
      - name: Test Linux Node concurrency and crash boundaries
        working-directory: services/node-agent
        run: |
          mkdir -p "$GITHUB_WORKSPACE/dist"
          go test -race -json ./... > "$GITHUB_WORKSPACE/dist/node-unit.jsonl" || { cat "$GITHUB_WORKSPACE/dist/node-unit.jsonl"; exit 1; }
      - name: Build Node and isolated synthetic workload image
        working-directory: services/node-agent
        run: |
          mkdir -p "$GITHUB_WORKSPACE/.work/node-image"
          CGO_ENABLED=0 go build -trimpath -o "$GITHUB_WORKSPACE/dist/inv-node" ./cmd/inv-node
          CGO_ENABLED=0 go build -trimpath -o "$GITHUB_WORKSPACE/dist/inv-discover" ./cmd/inv-discover
          CGO_ENABLED=0 go build -trimpath -o "$GITHUB_WORKSPACE/.work/node-image/probe" ./tests/probe
          CGO_ENABLED=0 go build -trimpath -o "$GITHUB_WORKSPACE/.work/node-image/inv-supervisor" ./cmd/inv-supervisor
          cp tests/probe/Dockerfile "$GITHUB_WORKSPACE/.work/node-image/Dockerfile"
          python "$GITHUB_WORKSPACE/tools/prepare_git_probe.py" "$GITHUB_WORKSPACE/.work/node-image"
          docker build --network=none --pull=false -t "inv-node-test:$GITHUB_SHA" "$GITHUB_WORKSPACE/.work/node-image"
          echo "INV_NODE_IMAGE=$(docker image inspect --format '{{.Id}}' "inv-node-test:$GITHUB_SHA")" >> "$GITHUB_ENV"
          echo "INV_NODE_BINARY=$GITHUB_WORKSPACE/dist/inv-node" >> "$GITHUB_ENV"
          echo "INV_RUN_NODE_TESTS=1" >> "$GITHUB_ENV"
      - name: Verify Docker API negotiation and actual bounded execution
        working-directory: services/node-agent
        env:
          INV_RUN_DOCKER_COMPAT: '1'
        run: go test -v -run '^TestDockerLiveCompatibility$' ./runtime > "$GITHUB_WORKSPACE/dist/docker-compatibility.log" 2>&1 || { cat "$GITHUB_WORKSPACE/dist/docker-compatibility.log"; exit 1; }
      - name: Build pinned Python workload image for kernel integration
        run: |
          docker pull python:3.12-slim
          python_base=$(docker image inspect --format '{{index .RepoDigests 0}}' python:3.12-slim)
          docker build --pull=false --build-arg "PYTHON_IMAGE=$python_base" -f deploy/testing/Dockerfile.python-node -t "inv-python-node:$GITHUB_SHA" .work/node-image
          echo "INV_PYTHON_NODE_IMAGE=$(docker image inspect --format '{{.Id}}' "inv-python-node:$GITHUB_SHA")" >> "$GITHUB_ENV"
      - name: Build owned LAN installer image and provide storage source root
        run: |
          mkdir -p .work/lan-node-image .work/storage-source
          cp dist/inv-node .work/lan-node-image/inv-node
          cp deploy/lan/Dockerfile.node .work/lan-node-image/Dockerfile
          docker build --network=none --pull=false -t "inv-lan-node-test:$GITHUB_SHA" .work/lan-node-image
          image_id=$(docker image inspect --format '{{.Id}}' "inv-lan-node-test:$GITHUB_SHA")
          echo "INV_UPGRADE_AGENT_IMAGE=$image_id" >> "$GITHUB_ENV"
          echo "INV_STORAGE_AGENT_IMAGE=$image_id" >> "$GITHUB_ENV"
          echo "INV_STORAGE_SOURCE_ROOT=$GITHUB_WORKSPACE/.work/storage-source" >> "$GITHUB_ENV"
      - name: Build production API image and require explicit configuration
        run: |
          docker build -f deploy/Dockerfile.backend -t "inv-api-test:$GITHUB_SHA" .
          image_id=$(docker image inspect --format '{{.Id}}' "inv-api-test:$GITHUB_SHA")
          test "$(docker image inspect --format '{{.Config.User}}' "$image_id")" = '65532:65532'
          if docker run --rm --network=none --read-only "inv-api-test:$GITHUB_SHA" > dist/api-unconfigured.log 2>&1; then
            echo 'Unconfigured production API must not start'
            exit 1
          fi
          grep -q 'Explicit Control Plane identity/database/Workspace configuration unavailable' dist/api-unconfigured.log
          # Keep the host publish loopback-only. Candidate containers on the
          # same default bridge receive the exact owned CX01 address instead
          # of widening the host port or guessing the bridge gateway.
          cx01_ip=$(docker inspect --format '{{(index .NetworkSettings.Networks "bridge").IPAddress}}' "$CX01_CONTAINER")
          test -n "$cx01_ip"
          docker run --rm --network=bridge postgres:16 pg_isready -h "$cx01_ip" -p 5432 -U postgres
          echo "INV_TEST_SERVER_IMAGE=$image_id" >> "$GITHUB_ENV"
          echo "INV_TEST_CONFIG_IMAGE=$image_id" >> "$GITHUB_ENV"
          echo "INV_CONTAINER_TEST_DB_HOST=$cx01_ip" >> "$GITHUB_ENV"
      - name: Verify Workspace recovery boundary first
        run: python -m pytest tests/integration/test_workspace_resume.py tests/integration/test_workspace_api.py -x -q --junitxml=dist/workspace-tests.xml -o faulthandler_timeout=45
      - name: Verify containment controls and physical cleanup
        run: python -m pytest tests/integration/test_containment.py -x -q --junitxml=dist/containment-tests.xml -o faulthandler_timeout=45
      - name: Verify business handoff against the execution kernel
        run: python -m pytest tests/integration/test_business_handoff.py -x -q --junitxml=dist/business-handoff-tests.xml -o faulthandler_timeout=45
      - name: Verify bounded shard replacement on two real Nodes
        run: python -m pytest tests/integration/test_shard_recovery.py -x -q --junitxml=dist/shard-recovery-tests.xml -o faulthandler_timeout=45
      - name: Run provisioned LAN installer acceptance
        run: python -m pytest -q tests/integration/test_workspace_upgrade.py tests/integration/test_lan_storage_install.py --junitxml=dist/lan-installer-tests.xml -o faulthandler_timeout=45
      - name: Require executed LAN installer evidence
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          root = ET.parse('dist/lan-installer-tests.xml').getroot()
          assert root.findall('.//testcase'), 'No LAN installer test evidence'
          assert not any(root.findall('.//' + tag) for tag in ('failure', 'error', 'skipped')), 'Every provisioned LAN installer test must run and pass'
          PY
      - name: Run owned CX01 recovery drill evidence
        run: python -m pytest tests/integration/test_recovery_drill.py -q --junitxml=dist/cx01-recovery-tests.xml -o faulthandler_timeout=45
      - name: Require executed CX01 recovery evidence
        run: |
          python - <<'PY'
          from collections import Counter
          import xml.etree.ElementTree as ET
          root = ET.parse('dist/cx01-recovery-tests.xml').getroot()
          cases = root.findall('.//testcase')
          assert len(cases) == 20, f'CX01 recovery case set drifted: {len(cases)}'
          assert not any(root.findall('.//' + tag) for tag in ('failure', 'error')), (
              'Every executable CX01 recovery case must pass'
          )
          # G-02: the two live archiver cases probe the owned container over
          # docker exec, so the internal-network skip no longer exists. Every
          # one of the 20 cases must execute here.
          skips = Counter(
              (skipped.get('message') or '').strip()
              for skipped in root.findall('.//skipped')
          )
          assert skips == Counter(), f'CX01 recovery skip distribution drifted: {skips}'
          setup_skip = 'CX01_CONTAINER is unset; container identity/ownership cannot be verified'
          assert setup_skip not in skips
          passed = len(cases) - sum(skips.values())
          assert passed == 20, f'Expected 20 passed CX01 cases, got {passed}'
          PY
      # Desktop browser tests execute in desktop-browser.yml with Chromium and Vite.
      # Web-container acceptance belongs to desktop-browser.yml. The two LAN
      # image-opt-in suites run in the explicit provisioned step above.
      - run: python -m pytest --junitxml=dist/core-tests.xml -o faulthandler_timeout=45 --ignore=tests/integration/test_desktop_browser.py --ignore=tests/integration/test_approval_browser.py --ignore=tests/integration/test_studio_browser.py --ignore=tests/integration/test_web_container.py --ignore=tests/integration/test_workspace_upgrade.py --ignore=tests/integration/test_lan_storage_install.py --ignore=tests/integration/test_s3_object_store_postgres.py --ignore=tests/integration/test_recovery_drill.py
      - name: Stop disposable product ObjectStore service
        if: always()
        run: docker rm --force saintvision-product-object-store 2>/dev/null || true
      - name: Docker host hygiene (explicit lane)
        # These prune real host residue. Keep them off the default/backend path.
        # This job already owns a disposable runner with a working Docker daemon.
        run: python -m pytest tests/test_check_kernel_docker_hygiene.py -m docker_host --strict-markers --junitxml=dist/docker-host-tests.xml
      - name: Require executed evidence and declared platform skips
        run: |
          python - <<'PY'
          from collections import Counter
          import xml.etree.ElementTree as ET
          root = ET.parse('dist/core-tests.xml').getroot()
          assert root.findall('.//testcase'), 'No test evidence'
          assert not any(root.findall('.//' + tag) for tag in ('failure', 'error')), 'Every executed test must pass'
          # These cases require a different platform, an explicit destructive-test
          # opt-in, or third-party agent CLIs.  Keep the exact reason/count map as
          # a ratchet: a new or silently broader skip makes this job fail.
          expected_skips = Counter({
              'PowerShell and csc.exe shim require Windows': 1,
              'Actual Windows PowerShell launcher': 10,
              'Explicit browser smoke integration lane required (INV_BROWSER_SMOKE_INTEGRATION=1)': 1,
              'run only through tools/placement_lock_wait_diagnostic.py': 1,
              'claude is not installed on this machine': 1,
              'codex is not installed on this machine': 1,
              'gemini is not installed on this machine': 1,
              'antigravity is not installed on this machine': 1,
          })
          actual_skips = Counter(
              (skipped.get('message') or '').strip()
              for skipped in root.findall('.//skipped')
          )
          assert actual_skips == expected_skips, (
              f'core skip distribution drifted: expected={expected_skips}, actual={actual_skips}'
          )
          host = ET.parse('dist/docker-host-tests.xml').getroot()
          host_cases = {case.get('name') for case in host.findall('.//testcase')}
          assert host_cases == {
              'test_prune_never_force_removes_a_running_concurrent_container',
              'test_prune_removes_old_exited_residue_but_spares_a_recent_one',
          }, f'docker-host case set drifted: {host_cases}'
          assert not any(host.findall('.//' + tag) for tag in ('failure', 'error', 'skipped')), 'Docker host lane must run and pass'
          PY
      - run: python -m build services/control-plane --outdir dist
      - run: go test ./...
        working-directory: packages/contracts-go
      - run: npx --yes --package typescript@5.9.3 tsc --noEmit --strict packages/contracts-ts/src/index.ts
      - name: Cleanup disposable CX01 PostgreSQL
        if: always()
        run: |
          if [ ! -f .work/cx01-container-id ]; then
            echo 'No CX01 receipt exists; no owned container is eligible for cleanup.'
            exit 0
          fi
          cx01_id="$(cat .work/cx01-container-id)"
          cx01_owner="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          expected_name="sv-cx01-${cx01_owner}"
          actual_owner="$(docker inspect --format '{{index .Config.Labels "ai.saintvision.cx01"}}' "$cx01_id")"
          actual_kernel_owner="$(docker inspect --format '{{index .Config.Labels "ai.saintvision.kernel-test"}}' "$cx01_id")"
          actual_name="$(docker inspect --format '{{.Name}}' "$cx01_id" | sed 's#^/##')"
          test "$actual_owner" = "$cx01_owner"
          test "$actual_kernel_owner" = "$cx01_owner"
          test "$actual_name" = "$expected_name"
          docker rm -f -v "$cx01_id"
          if docker inspect "$cx01_id" >/dev/null 2>&1; then
            echo 'Owned CX01 container still exists after cleanup.'
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: saintvision-core-evidence
          path: dist/
          retention-days: 30
  s01-storage-roundtrip:
    # Keep registry or candidate failures isolated from the normal Core proof.
    if: >-
      github.event_name != 'pull_request' ||
      contains(github.event.pull_request.labels.*.name, 'run-core')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: inv_test_only
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      MINIO_IMAGE: docker.io/coollabsio/minio@sha256:72b4794d7faa001823364f8ee239717141327fc450a3264414f573a6abf3c629
      MINIO_ROOT_USER: s01-roundtrip-ci
      MINIO_ROOT_PASSWORD: s01-roundtrip-ci-only-secret
      INV_OBJECT_STORE_ENDPOINT: http://127.0.0.1:9000
      INV_OBJECT_STORE_BUCKET: saintvision-roundtrip-ci
      INV_OBJECT_STORE_ACCESS_KEY_ID: s01-roundtrip-ci
      INV_OBJECT_STORE_SECRET_ACCESS_KEY: s01-roundtrip-ci-only-secret
      INV_OBJECT_STORE_REGION: us-east-1
      INV_OBJECT_STORE_TARGET_KIND: ci-candidate
      INV_EVIDENCE_CODE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      INV_TEST_ADMIN_DSN: postgresql://postgres:inv_test_only@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-test.txt
      - name: Install pinned product-conformance test dependencies
        run: python -m pip install -r requirements-test.txt
      - name: Start disposable MinIO candidate
        run: |
          mkdir -p dist
          docker pull --platform linux/amd64 "$MINIO_IMAGE"
          docker image inspect --format '{{index .RepoDigests 0}}' "$MINIO_IMAGE" > dist/s01-minio-image.txt
          docker run --detach --rm --platform linux/amd64 \
            --name saintvision-s01-minio \
            --tmpfs /data:rw,noexec,nosuid,size=64m \
            --publish 127.0.0.1:9000:9000 \
            --env MINIO_ROOT_USER \
            --env MINIO_ROOT_PASSWORD \
            "$MINIO_IMAGE" server /data --address ':9000'
          for attempt in $(seq 1 45); do
            if curl --fail --silent --show-error http://127.0.0.1:9000/minio/health/live > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          docker logs saintvision-s01-minio
          exit 1
      - name: Create disposable S01 Storage test bucket
        run: |
          python - <<'PY'
          import os
          from tools.verify_storage_roundtrip import S3Client, load_config

          response = S3Client(load_config(os.environ)).create_bucket()
          assert response.status == 200, f'redacted bucket setup failed ({response.status})'
          PY
      - name: Verify product ObjectStore adapter conformance
        env:
          PYTHONPATH: services/control-plane/src
        run: >-
          python -m pytest -q tools/test_s3_object_store_hosted.py
          --junitxml=dist/s3-product-object-store.xml
      - name: Verify product S3 persistence and PostgreSQL tenant boundary
        env:
          PYTHONPATH: services/control-plane/src
        run: >-
          python -m pytest -q tests/integration/test_s3_object_store_postgres.py
          --junitxml=dist/s3-product-postgres.xml
      - name: Verify S01 Storage candidate SHA-256 roundtrip and cleanup
        if: always()
        run: >-
          python tools/verify_storage_roundtrip.py
          --target-kind ci-candidate
          --output dist/s01-storage-roundtrip.json
          --junit dist/s01-storage-roundtrip.xml
      - name: Stop disposable S01 Storage service
        if: always()
        run: docker rm --force saintvision-s01-minio 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: saintvision-s01-storage-evidence-${{ github.run_id }}
          path: dist/
          retention-days: 30
