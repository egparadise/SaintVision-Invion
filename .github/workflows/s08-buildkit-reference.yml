name: S08 BuildKit Reference
run-name: ${{ inputs.correlation_id || github.workflow }}
on:
  workflow_dispatch:
    inputs:
      correlation_id:
        description: 'Opaque id used only to bind this exact manual run'
        required: false
        default: ''
  pull_request:
    types: [labeled]

permissions:
  contents: read

concurrency:
  group: s08-buildkit-reference-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: false

jobs:
  rootless-roundtrip:
    # Reference evidence only. This does not enable product dispatch or claim
    # LAN builder operational acceptance.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.pull_request.labels.*.name, 'run-buildkit')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BUILDKIT_VERSION: v0.20.2
      BUILDKIT_ARCHIVE_SHA256: f64589601e0f06164041dc6be45ed259cffb67539130e434d236551d63ab6030
      ROOTLESSKIT_VERSION: v3.2.0
      ROOTLESSKIT_ARCHIVE_SHA256: ff612d1d35854a52569acc4a4e9152f41504e69dcc13ff4c94cc9040dc28b3d9
      INV_EVIDENCE_CODE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-test.txt
      - name: Verify exact clean source
        run: |
          test "$(git rev-parse HEAD)" = "$INV_EVIDENCE_CODE_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
      - name: Install rootless user-namespace prerequisites
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends uidmap slirp4netns
          if ! grep -q "^${USER}:" /etc/subuid; then
            echo "${USER}:100000:65536" | sudo tee -a /etc/subuid >/dev/null
          fi
          if ! grep -q "^${USER}:" /etc/subgid; then
            echo "${USER}:100000:65536" | sudo tee -a /etc/subgid >/dev/null
          fi
      - name: Download digest-pinned BuildKit and RootlessKit
        run: |
          mkdir -p dist/s08-buildkit-reference "$RUNNER_TEMP/s08-download" "$RUNNER_TEMP/s08-bin/buildkit" "$RUNNER_TEMP/s08-bin/rootlesskit"
          curl --fail --location --retry 3 --silent --show-error \
            --output "$RUNNER_TEMP/s08-download/buildkit.tar.gz" \
            "https://github.com/moby/buildkit/releases/download/${BUILDKIT_VERSION}/buildkit-${BUILDKIT_VERSION}.linux-amd64.tar.gz"
          echo "$BUILDKIT_ARCHIVE_SHA256  $RUNNER_TEMP/s08-download/buildkit.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/s08-download/buildkit.tar.gz" -C "$RUNNER_TEMP/s08-bin/buildkit" --strip-components=1
          curl --fail --location --retry 3 --silent --show-error \
            --output "$RUNNER_TEMP/s08-download/rootlesskit.tar.gz" \
            "https://github.com/rootless-containers/rootlesskit/releases/download/${ROOTLESSKIT_VERSION}/rootlesskit-x86_64.tar.gz"
          echo "$ROOTLESSKIT_ARCHIVE_SHA256  $RUNNER_TEMP/s08-download/rootlesskit.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/s08-download/rootlesskit.tar.gz" -C "$RUNNER_TEMP/s08-bin/rootlesskit"
          "$RUNNER_TEMP/s08-bin/buildkit/buildkitd" --version | tee dist/s08-buildkit-reference/buildkit-version.txt
          "$RUNNER_TEMP/s08-bin/rootlesskit/rootlesskit" --version | tee dist/s08-buildkit-reference/rootlesskit-version.txt
      - name: Execute actual rootless BuildKit OCI roundtrip
        env:
          SV_BUILDKIT_BIN_DIR: ${{ runner.temp }}/s08-bin/buildkit
          SV_ROOTLESSKIT_BIN: ${{ runner.temp }}/s08-bin/rootlesskit/rootlesskit
          SV_BUILDKIT_OUTPUT_DIR: ${{ github.workspace }}/dist/s08-buildkit-reference
          SV_BUILDKIT_RUNTIME_DIR: ${{ runner.temp }}/s08-buildkit-runtime
        run: bash tools/run_buildkit_rootless_lane.sh
      - name: Require measured reference evidence
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          import xml.etree.ElementTree as ET

          root = Path('dist/s08-buildkit-reference')
          report = json.loads((root / 'rootless-buildkit-reference.json').read_text(encoding='utf-8'))
          assert report['verdict'] == 'MEASURED_PASS'
          assert report['targetKind'] == 'ci-reference'
          assert report['operationalAcceptanceAssessed'] is False
          assert report['productDispatchEnabled'] is False
          assert report['codeSha'] == os.environ['INV_EVIDENCE_CODE_SHA']
          assert report['cleanCheckout'] is True
          assert report['limitations'] == [
              'reference-only-no-product-consumer',
              'lease-release-not-bound',
              'evidence-persistence-not-bound',
              'lan-builder-acceptance-blocked-external',
          ]
          junit = ET.parse(root / 'rootless-buildkit-reference.xml').getroot()
          assert len(junit.findall('.//testcase')) == 1
          assert not any(junit.findall('.//' + tag) for tag in ('failure', 'error', 'skipped'))
          PY
      - name: Preserve redacted BuildKit reference evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: saintvision-s08-buildkit-reference-${{ github.run_id }}
          path: |
            dist/s08-buildkit-reference/rootless-buildkit-reference.json
            dist/s08-buildkit-reference/rootless-buildkit-reference.xml
            dist/s08-buildkit-reference/rootless-buildkit-metadata.json
            dist/s08-buildkit-reference/buildkitd.log
            dist/s08-buildkit-reference/buildkit-version.txt
            dist/s08-buildkit-reference/rootlesskit-version.txt
          retention-days: 30
