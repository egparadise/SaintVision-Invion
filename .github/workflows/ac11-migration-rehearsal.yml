name: AC-11 Migration Rehearsal

on:
  workflow_dispatch:
  pull_request:
    types: [labeled]

permissions:
  contents: read

jobs:
  migration-rehearsal:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && github.event.label.name == 'run-ac11-migration')
    runs-on: ubuntu-latest
    concurrency:
      group: ac11-migration-${{ github.event.pull_request.head.sha || github.sha }}
      cancel-in-progress: false
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: invowner
          POSTGRES_PASSWORD: ci_local_only
          POSTGRES_DB: invdev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U invowner -d invdev"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      SOURCE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      INV_TEST_ADMIN_DSN: postgresql://invowner:ci_local_only@localhost:5432/postgres
      REPORT: evidence/s11-ac11-migration-rehearsal.json
      JUNIT: evidence/s11-ac11-migration-rehearsal.xml
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_HEAD_SHA }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements-backend.txt
            requirements-test.txt

      - name: Install runner dependencies
        run: python -m pip install -r requirements-backend.txt -r requirements-docs.txt

      - name: Record clean source and execute one owned rehearsal
        run: |
          git fetch --no-tags origin a793f258dac9b2a4951df084089bf3a3a3ae1bcc
          test -z "$(git status --porcelain)"
          python tools/run_ac11_migration_rehearsal.py \
            --source-run-id "${{ github.run_id }}" \
            --source-head-sha "$SOURCE_HEAD_SHA" \
            --runner-image "${{ runner.os }}-${{ runner.arch }}" \
            --report "$REPORT" \
            --junit "$JUNIT"

      - name: Validate evidence and cleanup receipt
        if: always()
        run: |
          python - <<'PY'
          import json
          import os
          import xml.etree.ElementTree as ET
          from pathlib import Path

          report_path = Path(os.environ['REPORT'])
          junit_path = Path(os.environ['JUNIT'])
          assert report_path.is_file(), 'missing rehearsal JSON'
          assert junit_path.is_file(), 'missing rehearsal JUnit'
          report = json.loads(report_path.read_text(encoding='utf-8'))
          assert report['sourceHeadSha'] == os.environ['SOURCE_HEAD_SHA']
          assert report['cleanCheckout'] is True
          assert report['cleanup']['residueCount'] == 0
          assert report['axes'][0]['verdict'] == 'NOT_APPLICABLE'
          assert report['axes'][1]['verdict'] == 'MEASURED_PASS'
          root = ET.parse(junit_path).getroot()
          assert root.attrib == {
              'name': 's11-ac11-migration-rehearsal',
              'tests': '6',
              'failures': '0',
              'errors': '0',
              'skipped': '1',
          }
          PY

      - name: Upload AC-11 migration evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: s11-ac11-migration-${{ env.SOURCE_HEAD_SHA }}
          path: evidence/
          if-no-files-found: error
          retention-days: 30
