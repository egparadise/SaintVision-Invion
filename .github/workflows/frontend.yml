name: Frontend Build & Test
# Only a dispatch that passes `correlation_id` changes this; every other event keeps
# the workflow name. The value is used for the run's display name only.
run-name: ${{ inputs.correlation_id || github.workflow }}
on:
  workflow_dispatch:
    inputs:
      correlation_id:
        # Opaque id echoed into the run name, and read nowhere else, so a tool that
        # dispatched this run can recognise it among runs other people dispatched at
        # the same ref and commit (tools/post_landing_verify.py). The run list gives
        # no link between a dispatch and the run it creates, and run ids and
        # timestamps cannot tell two concurrent dispatches apart.
        description: 'Opaque id for a tool to bind this exact run; leave empty for a normal manual run'
        required: false
        default: ''
  push:
    branches:
      - main
      - integration/all-agents-unified
  pull_request:
    paths:
      - 'apps/web/**'
      - 'contracts/**'
      - 'packages/contracts-ts/**'
      - '.github/workflows/frontend.yml'
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Keep shared evidence branches ordered, but let a PR merge ref or a manually
  # dispatched agent branch replace its own stale run.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/integration/all-agents-unified' }}
permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        working-directory: apps/web
        run: npm ci

      - name: Run Vitest Unit Tests
        working-directory: apps/web
        run: npm run test

      - name: Check generated discovery contract type
        working-directory: apps/web
        run: npm run contracts:check

      - name: TypeScript Check & Production Build
        working-directory: apps/web
        run: npm run build

      - name: Upload Web Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: saintvision-web-dist
          path: apps/web/dist
          retention-days: 14
