name: Frontend Build & Test
on:
  push:
    paths:
      - 'apps/web/**'
      - 'tests/integration/test_web_container.py'
      - 'tests/fixtures/nginx_transport.py'
      - 'docker-compose.prod.yml'
      - '.github/workflows/frontend.yml'
  pull_request:
    paths:
      - 'apps/web/**'
      - 'tests/integration/test_web_container.py'
      - 'tests/fixtures/nginx_transport.py'
      - 'docker-compose.prod.yml'
      - '.github/workflows/frontend.yml'
permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        working-directory: apps/web
        run: npm ci

      - name: Run Vitest Unit Tests
        working-directory: apps/web
        run: npm run test

      - name: TypeScript Check & Production Build
        working-directory: apps/web
        run: npm run build

      - name: Upload Web Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: saintvision-web-dist
          path: apps/web/dist
          retention-days: 14

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install proxy verification dependencies
        run: python -m pip install -r requirements-backend.txt -r requirements-browser.txt
      - name: Install actual browser
        run: python -m playwright install --with-deps chromium
      - name: Build actual frontend container
        run: docker build -t saintvision-web-ci:${{ github.sha }} apps/web
      - name: Verify TLS proxy and deployment settings
        env:
          INV_WEB_IMAGE: saintvision-web-ci:${{ github.sha }}
        run: python -m pytest -q tests/integration/test_web_container.py tests/core/test_deployment_credentials.py
