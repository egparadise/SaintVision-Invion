name: S05 Legacy Concurrency Staircase
on:
  workflow_dispatch:
  pull_request:
    types:
      - labeled
permissions:
  contents: read
jobs:
  s05-legacy-staircase:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.label.name == 'run-s05-legacy-staircase'
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: inv_test_only
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      INV_TEST_ADMIN_DSN: postgresql://postgres:inv_test_only@127.0.0.1:5432/postgres
      INV_EVIDENCE_CODE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-test.txt
      - name: Install focused benchmark dependencies
        run: python -m pip install -r requirements-test.txt
      - name: Run preregistered legacy staircase sequentially
        run: >-
          python tools/run_s05_legacy_staircase.py
          --output-dir dist/s05-legacy-staircase
          --run-purpose clean-integration-base-execution-compatibility
          --canonical-decision-evidence-run-id 36362386530
          --measurement-scope hosted-single-runner-legacy-only-postgresql16
      - name: Upload S05 legacy staircase evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: saintvision-s05-legacy-staircase-${{ github.run_id }}
          path: dist/s05-legacy-staircase
          if-no-files-found: error
          retention-days: 14
