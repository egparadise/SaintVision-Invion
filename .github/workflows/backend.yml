name: Backend Build
on:
  workflow_dispatch:
  push:
    branches:
      - main
      - integration/all-agents-unified
  pull_request:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Keep shared evidence branches ordered, but let a PR merge ref or a manually
  # dispatched agent branch replace its own stale run.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/integration/all-agents-unified' }}
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest

    # Both sides of the 3.13 dataclass/slots change. The first CI run failed
    # only on 3.12 while passing on the 3.14 development machine, so a single
    # version is not enough to trust.
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.14']

    # A real PostgreSQL, because the properties under test — RLS under a
    # non-owner role, NULLS NOT DISTINCT, partition routing — have no
    # substitute. Without it the suite would skip and report a false green.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: invowner
          POSTGRES_PASSWORD: ci_local_only
          POSTGRES_DB: invdev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U invowner -d invdev"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      INV_ENV: test
      # INV_DATABASE_URL is deliberately NOT set job-wide. Test fixtures that
      # provision their own database pass INV_MIGRATION_DSN, and an ambient
      # default in scope for their subprocesses is how migrations end up
      # applied to the wrong database. The migration steps below set it
      # themselves.
      INV_TEST_DATABASE_URL: postgresql+psycopg://invowner:ci_local_only@localhost:5432/invdev
      # Codex's suites refuse to skip in CI and want an admin DSN of their own.
      # Pointing it at this job's database is deliberate: running both halves
      # against one PostgreSQL is the only way the integration is actually
      # regression-tested rather than each side passing in its own container.
      # invowner is this container's superuser, which is what their fixtures
      # need to provision roles and schemas.
      INV_TEST_ADMIN_DSN: postgresql://invowner:ci_local_only@localhost:5432/invdev
      # Role-shape rejection tests mutate cluster-wide role flags. They own a
      # separate disposable cluster instead of altering the shared service.
      INV_TEST_ROLE_GUARD_IMAGE: postgres:16

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements-backend.txt
            requirements-test.txt
            requirements-core.txt
      - run: python -m pip install -r requirements-backend.txt -r requirements-docs.txt

      - name: Contract schemas match their models
        run: python tools/export_schemas.py --check

      - name: Migration renders offline
        env:
          # Offline rendering never connects, but alembic still requires a URL
          # to pick a dialect. Named INV_MIGRATION_DSN like every other step
          # that targets a specific database.
          INV_MIGRATION_DSN: postgresql+psycopg://offline:offline@localhost:1/offline
        run: python -m alembic upgrade head --sql > /dev/null

      - name: Migration graph has a single integrated head
        run: python tools/migration_graph.py

      - name: Migration applies to an empty database
        env:
          INV_MIGRATION_DSN: postgresql+psycopg://invowner:ci_local_only@localhost:5432/invdev
        run: python -m alembic upgrade head

      - name: The reversible tail reverses
        # Not a blind `downgrade base`. Some revisions are deliberately
        # irreversible — PLAN-DB-001 says an irreversible migration states a
        # verified restore and forward-fix plan instead of forcing a downgrade,
        # and 0006_control_api does. Rolling past one is not a test to fix; it
        # is the thing the plan says not to do. So only the tail above the
        # newest irreversible revision is exercised, and when there is no such
        # tail the step says so rather than passing quietly.
        env:
          INV_MIGRATION_DSN: postgresql+psycopg://invowner:ci_local_only@localhost:5432/invdev
        run: |
          TARGET=$(python tools/migration_graph.py --downgrade-target)
          HEAD=$(python tools/migration_graph.py --head)
          if [ "$TARGET" = "$HEAD" ]; then
            echo "No reversible tail: head ($HEAD) is itself irreversible."
            echo "Rollback for this chain is by verified restore, not downgrade."
          else
            python -m alembic downgrade "$TARGET"
            python -m alembic upgrade head
          fi

      # Desktop browser tests execute in desktop-browser.yml with Chromium and Vite.
      # pyproject defaults deselect docker_host mutations; Core Build runs that lane explicitly.
      - name: Tests
        # -p no:randomly keeps ordering deterministic; the suite fails if any
        # PostgreSQL-marked test is skipped, so a missing database cannot pass
        # as a green build.
        # tests/core and tests/integration are NOT excluded wholesale. Running
        # the business surface and the execution core against one PostgreSQL is
        # the only place their combined behaviour is exercised at all; excluding
        # them leaves each half passing in its own container and the seam
        # between them untested.
        #
        # The suites that need the Go agent binary and a built container image
        # are left to Core Build, which provides both. Their three image-only
        # acceptance files are likewise run by Core (workspace/storage) or the
        # browser workflow (web container), not collected here without opt-ins.
        # The Node-runtime list is computed,
        # not typed: it was three files, then thirteen, and most are reached
        # transitively through shared fixtures. A hardcoded list here goes stale
        # silently, and the symptom of a stale ignore list is a test that stops
        # running rather than an error.
        run: |
          IGNORES=$(python tools/node_dependent_tests.py --pytest-args)
          echo "Left to Core Build (needs the Node runtime):"
          python tools/node_dependent_tests.py | sed 's/^/  /'
          python -m pytest -q --strict-markers --junitxml=backend-tests.xml $IGNORES --ignore=tests/integration/test_desktop_browser.py --ignore=tests/integration/test_approval_browser.py --ignore=tests/integration/test_studio_browser.py --ignore=tests/integration/test_web_container.py --ignore=tests/integration/test_workspace_upgrade.py --ignore=tests/integration/test_lan_storage_install.py

      - name: Require executed evidence and declared platform skips
        run: |
          python - <<'PY'
          from collections import Counter
          import xml.etree.ElementTree as ET
          root = ET.parse('backend-tests.xml').getroot()
          assert root.findall('.//testcase'), 'No backend test evidence'
          assert not any(root.findall('.//' + tag) for tag in ('failure', 'error')), 'Every executed backend test must pass'
          # PostgreSQL is mandatory in this job.  The remaining skips require a
          # different OS, an explicit image/container lane, or third-party
          # agent CLIs.  Pin the exact reason/count map so skip remains visible
          # evidence rather than being counted as success or allowed to grow.
          expected_skips = Counter({
              'PowerShell and csc.exe shim require Windows': 1,
              'Explicit pinned local candidate image required': 2,
              'Actual Windows PowerShell launcher': 10,
              'Explicit browser smoke integration lane required (INV_BROWSER_SMOKE_INTEGRATION=1)': 1,
              'CX01_CONTAINER is unset; container identity/ownership cannot be verified': 19,
              'Explicit candidate image and disposable container DB address required': 8,
              'claude is not installed on this machine': 1,
              'codex is not installed on this machine': 1,
              'gemini is not installed on this machine': 1,
              'antigravity is not installed on this machine': 1,
          })
          actual_skips = Counter(
              (skipped.get('message') or '').strip()
              for skipped in root.findall('.//skipped')
          )
          assert actual_skips == expected_skips, (
              f'backend skip distribution drifted: expected={expected_skips}, actual={actual_skips}'
          )
          PY
