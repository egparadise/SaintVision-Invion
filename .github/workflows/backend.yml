name: Backend Build
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest

    # Both sides of the 3.13 dataclass/slots change. The first CI run failed
    # only on 3.12 while passing on the 3.14 development machine, so a single
    # version is not enough to trust.
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.14']

    # A real PostgreSQL, because the properties under test — RLS under a
    # non-owner role, NULLS NOT DISTINCT, partition routing — have no
    # substitute. Without it the suite would skip and report a false green.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: invowner
          POSTGRES_PASSWORD: ci_local_only
          POSTGRES_DB: invdev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U invowner -d invdev"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      INV_ENV: test
      # INV_DATABASE_URL is deliberately NOT set job-wide. Test fixtures that
      # provision their own database pass INV_MIGRATION_DSN, and an ambient
      # default in scope for their subprocesses is how migrations end up
      # applied to the wrong database. The migration steps below set it
      # themselves.
      INV_TEST_DATABASE_URL: postgresql+psycopg://invowner:ci_local_only@localhost:5432/invdev
      # Codex's suites refuse to skip in CI and want an admin DSN of their own.
      # Pointing it at this job's database is deliberate: running both halves
      # against one PostgreSQL is the only way the integration is actually
      # regression-tested rather than each side passing in its own container.
      # invowner is this container's superuser, which is what their fixtures
      # need to provision roles and schemas.
      INV_TEST_ADMIN_DSN: postgresql://invowner:ci_local_only@localhost:5432/invdev

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements-backend.txt
            requirements-test.txt
            requirements-core.txt
      - run: python -m pip install -r requirements-backend.txt

      - name: Contract schemas match their models
        run: python tools/export_schemas.py --check

      - name: Migration renders offline
        env:
          # Offline rendering never connects, but alembic still requires a URL
          # to pick a dialect. Named INV_MIGRATION_DSN like every other step
          # that targets a specific database.
          INV_MIGRATION_DSN: postgresql+psycopg://offline:offline@localhost:1/offline
        run: python -m alembic upgrade head --sql > /dev/null

      - name: Migration graph has a single integrated head
        run: python tools/migration_graph.py

      - name: Migration applies to an empty database
        env:
          INV_MIGRATION_DSN: postgresql+psycopg://invowner:ci_local_only@localhost:5432/invdev
        run: python -m alembic upgrade head

      - name: The reversible tail reverses
        # Not a blind `downgrade base`. Some revisions are deliberately
        # irreversible — PLAN-DB-001 says an irreversible migration states a
        # verified restore and forward-fix plan instead of forcing a downgrade,
        # and 0006_control_api does. Rolling past one is not a test to fix; it
        # is the thing the plan says not to do. So only the tail above the
        # newest irreversible revision is exercised, and when there is no such
        # tail the step says so rather than passing quietly.
        env:
          INV_MIGRATION_DSN: postgresql+psycopg://invowner:ci_local_only@localhost:5432/invdev
        run: |
          TARGET=$(python tools/migration_graph.py --downgrade-target)
          HEAD=$(python tools/migration_graph.py --head)
          if [ "$TARGET" = "$HEAD" ]; then
            echo "No reversible tail: head ($HEAD) is itself irreversible."
            echo "Rollback for this chain is by verified restore, not downgrade."
          else
            python -m alembic downgrade "$TARGET"
            python -m alembic upgrade head
          fi

      - name: Tests
        # -p no:randomly keeps ordering deterministic; the suite fails if any
        # PostgreSQL-marked test is skipped, so a missing database cannot pass
        # as a green build.
        run: python -m pytest -q --strict-markers --ignore=tests/core --ignore=tests/integration --junitxml=backend-tests.xml

      - name: No PostgreSQL test was skipped
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          root = ET.parse('backend-tests.xml').getroot()
          assert not root.findall('.//skipped'), 'Backend tests must not be skipped'
          PY
