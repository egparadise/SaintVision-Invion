name: AC-11 Axis Aggregation
# Only a dispatch that passes `correlation_id` changes this; every other event keeps the
# workflow name. The value is used for the run's display name only.
run-name: ${{ inputs.correlation_id || github.workflow }}

# `workflow_dispatch` only, and deliberately no `push`.
#
# Two reasons, and neither is tidiness. A workflow that triggered on a push to
# integration/all-agents-unified would owe a lane in tools/post_landing_verify.py -- the
# reverse ratchet in tests/core/test_post_landing_verify.py asserts exactly that -- and
# this is not a landing gate: it reads the *other* lanes' artifacts, so it has nothing to
# say until they have run. And the aggregation is about one exact SHA; running it on every
# push would produce a stream of INVALID_RUN answers about trees nobody was asking about.
on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: 'The exact 40-hex commit to aggregate. Envelopes from any other SHA are refused.'
        required: true
      correlation_id:
        description: 'Opaque id for a tool to bind this exact run; leave empty for a normal manual run'
        required: false
        default: ''
  # Opt-in on pull requests, by label, exactly like ac11-security-scan.yml.
  #
  # Not decoration: a `workflow_dispatch`-only workflow that has never run is not in
  # GitHub's workflow index, and dispatching it answers
  # `HTTP 404: workflow ac11-aggregate.yml not found on the default branch` -- measured on
  # this branch (#299 r1). So a lane like this cannot be exercised before it lands unless
  # some other event registers it. The label is that event, and it stays opt-in so no
  # ordinary pull request spends a runner on it.
  pull_request:
    types: [labeled, synchronize, reopened]

# `actions: read` is the whole reason this is a separate lane: it reads other runs'
# artifacts, which `contents: read` cannot do. Nothing here writes to the repository.
permissions:
  contents: read
  actions: read

jobs:
  ac11-aggregate:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.pull_request.labels.*.name, 'run-ac11-aggregate')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: ac11-aggregate-${{ inputs.source_sha || github.event.pull_request.head.sha }}
      cancel-in-progress: false
    env:
      # On a dispatch the operator names the SHA; on a labelled pull request it is that
      # pull request's head, because any other SHA would describe a tree nobody asked about.
      SOURCE_SHA: ${{ inputs.source_sha || github.event.pull_request.head.sha }}
      REPO: ${{ github.repository }}
      ENVELOPES: evidence/ac11-axes
      MANIFEST: evidence/ac11-aggregate-manifest.json
      ASSEMBLY: evidence/ac11-assembly-report.json
      RESULT: evidence/ac11-aggregate-result.json
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Refuse anything that is not an exact commit
        shell: bash
        run: |
          set -euo pipefail
          if ! printf '%s' "$SOURCE_SHA" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "source_sha must be a full 40-hex lowercase commit, got '$SOURCE_SHA'" >&2
            exit 1
          fi

      - name: Checkout that exact commit
        uses: actions/checkout@v4
        with:
          # SOURCE_SHA, not inputs.source_sha. On a pull_request event there is no input,
          # so this said `ref: ''` and actions/checkout fell back to the event's default:
          # refs/pull/<n>/merge, GitHub's ephemeral merge commit. Measured in run
          # 36921695718 -- "HEAD is now at 030e6283 Merge 77456da4 into aaa0b083" -- so the
          # lane read docs/ac11-axis-sources.json and the importers from a tree that does
          # not exist in the repository while binding every artifact lookup to 77456da4
          # (#299 r2). That is the exact confusion this whole chain exists to refuse.
          ref: ${{ env.SOURCE_SHA }}
          # The aggregator reads the migration graph and compares trees, so it needs the
          # history, not just this commit.
          fetch-depth: 0
          persist-credentials: false

      - name: Prove the checkout is that commit and nothing else
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          head=$(git rev-parse HEAD)
          if [ "$head" != "$SOURCE_SHA" ]; then
            echo "checked out $head but this run is about $SOURCE_SHA" >&2
            echo "an empty ref makes actions/checkout take the event default, which on a" >&2
            echo "pull_request is refs/pull/<n>/merge -- a tree the repository does not have" >&2
            exit 1
          fi
          # Written into the artifact so the binding is checkable after the fact, rather
          # than only readable in a log that expires.
          # python3, not python: this step runs before actions/setup-python on purpose --
          # a wrong tree must stop the lane before it installs anything -- and the image
          # guarantees python3 only.
          HEAD_SHA="$head" python3 - <<'PY' > evidence/ac11-checkout.json
          import json, os
          print(json.dumps({
              "schemaVersion": "ac11-aggregate-checkout:1",
              "sourceSha": os.environ["SOURCE_SHA"],
              "checkoutSha": os.environ["HEAD_SHA"],
              "event": os.environ["EVENT"],
              "runId": os.environ["RUN_ID"],
              "correlationId": os.environ["CORRELATION_ID"],
          }, sort_keys=True))
          PY
          cat evidence/ac11-checkout.json
        env:
          EVENT: ${{ github.event_name }}
          RUN_ID: ${{ github.run_id }}
          CORRELATION_ID: ${{ inputs.correlation_id }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - run: python -m pip install -r requirements-test.txt

      - name: Collect the axis envelopes that exist at this SHA
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$ENVELOPES"
          # One row per axis whose chain the sources file calls complete: the workflow file,
          # the artifact name prefix, the envelope member and the importer. Read from the
          # file rather than written here, so adding an axis is a change to the file.
          python - <<'PY' > /tmp/complete.tsv
          import json, pathlib
          doc = json.loads(pathlib.Path("docs/ac11-axis-sources.json").read_text(encoding="utf-8"))
          seen = set()
          for entry in doc["axes"]:
              if entry["chain"] != "complete":
                  continue
              key = (entry["workflow"], entry["artifactNamePrefix"])
              if key in seen:
                  continue          # two axes can share one run; collect it once
              seen.add(key)
              # A row may name supplemental evidence: a second artifact that axis needs and the
              # tool which finds it.  Empty fields mean "none", so the loop reads four or six
              # columns without a second format (card 233).
              supplemental = entry["supplementalEvidence"] or {}
              print("\t".join([
                  entry["workflow"].rsplit("/", 1)[-1],
                  entry["artifactNamePrefix"],
                  entry["importer"],
                  entry["importerArchiveFlag"],
                  supplemental.get("finder", ""),
                  supplemental.get("flag", ""),
                  supplemental.get("threatId", ""),
              ]))
          PY
          while IFS=$'\t' read -r workflow prefix importer archive_flag finder flag threat; do
            echo "::group::$workflow"
            run_id=$(gh run list --workflow "$workflow" --limit 50 \
              --json databaseId,headSha,status,conclusion \
              --jq "[.[] | select(.headSha == \"$SOURCE_SHA\" and .status == \"completed\" and .conclusion == \"success\")] | if length > 0 then (.[0].databaseId | tostring) else \"\" end")
            if [ -z "$run_id" ]; then
              echo "no successful run of $workflow at $SOURCE_SHA -- this axis will be absent"
              echo "::endgroup::"
              continue
            fi
            artifact_id=$(gh api "repos/$REPO/actions/runs/$run_id/artifacts" \
              --jq "[.artifacts[] | select(.name == \"$prefix$SOURCE_SHA\")] | if length == 1 then (.[0].id | tostring) else \"\" end")
            if [ -z "$artifact_id" ]; then
              echo "run $run_id has no single artifact named $prefix$SOURCE_SHA -- absent"
              echo "::endgroup::"
              continue
            fi
            gh api "repos/$REPO/actions/runs/$run_id"            > /tmp/run.json
            gh api "repos/$REPO/actions/artifacts/$artifact_id"  > /tmp/artifact.json
            gh api "repos/$REPO/actions/artifacts/$artifact_id/zip" > /tmp/artifact.zip
            base=$(basename "$importer" .py)
            # Supplemental evidence, when the row names a finder: a second artifact this axis
            # needs.  The finder requires exactly one candidate at the same source SHA and only
            # downloads it -- the verification stays in the importer (card 233).  Exit 3 means
            # "no single candidate", which is an answer: the import continues without it and the
            # envelope's own reason names the threat report that is therefore not admissible.
            # It is never a silent omission, and never a reason to fail this lane.
            supplemental=()
            if [ -n "$finder" ]; then
              rm -rf /tmp/vf-evidence
              set +e
              document=$(python "$finder" --source-sha "$SOURCE_SHA" --out-dir /tmp/vf-evidence 2>/tmp/vf-reason)
              finder_code=$?
              set -e
              if [ "$finder_code" -eq 0 ] && [ -n "$document" ]; then
                supplemental=("$flag" "$document")
                echo "supplemental evidence for ${threat:-?}: $document"
              else
                echo "no supplemental evidence for ${threat:-?} (finder exit $finder_code):"
                cat /tmp/vf-reason || true
                if [ "$finder_code" -ne 3 ]; then
                  echo "the finder failed rather than finding nothing -- recorded, lane continues" >&2
                fi
                printf '%s\n' "${threat:-?} NOT_OBSERVED: $(cat /tmp/vf-reason 2>/dev/null | tr '\n' ' ')" \
                  >> "$ENVELOPES/../supplemental-missing.txt"
              fi
            fi
            # The flag name comes from the sources file: the two importers in this chain
            # take the zip under different names, and trying both would turn a real
            # refusal into a retry with the wrong flag.
            python "$importer" \
              "$archive_flag" /tmp/artifact.zip \
              --run-metadata /tmp/run.json \
              --artifact-metadata /tmp/artifact.json \
              ${supplemental[@]+"${supplemental[@]}"} \
              --output "$ENVELOPES/$base.json"
            echo "::endgroup::"
          done < /tmp/complete.tsv
          ls -la "$ENVELOPES" || true

      - name: Assemble the manifest, naming every axis it could not
        shell: bash
        run: |
          set -euo pipefail
          python tools/assemble_ac11_manifest.py \
            --release-sha "$SOURCE_SHA" \
            --envelopes "$ENVELOPES" \
            --output "$MANIFEST" \
            --report "$ASSEMBLY"
          cat "$ASSEMBLY"
          # Supplemental evidence that could not be found is part of this run's answer, so it is
          # printed here and uploaded with the rest rather than left in a step log (card 233).
          if [ -f "$ENVELOPES/../supplemental-missing.txt" ]; then
            echo "::warning::supplemental evidence missing at this SHA:"
            cat "$ENVELOPES/../supplemental-missing.txt"
            cp "$ENVELOPES/../supplemental-missing.txt" evidence/ac11-supplemental-missing.txt
          fi

      - name: Recompute the eight axes
        id: aggregate
        shell: bash
        run: |
          set -uo pipefail
          code=0
          python tools/aggregate_ac11_evidence.py \
            --manifest "$MANIFEST" \
            --output "$RESULT" || code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          # 0 all eight recomputed MEASURED_PASS, 1 valid evidence and AC-11 not done,
          # 2 the manifest or an envelope is invalid. All three are answers; only an
          # unexpected code is a failure of this lane.
          case "$code" in
            0|1|2) echo "the aggregator reached a verdict (exit $code)" ;;
            *) echo "the aggregator did not run (exit $code)" >&2; exit "$code" ;;
          esac
          python - <<'PY'
          import json, os, pathlib
          result = json.loads(pathlib.Path(os.environ["RESULT"]).read_text(encoding="utf-8"))
          print("verdict:", result.get("verdict"), "done:", result.get("done"))
          for axis in result.get("axes", []):
              print(" ", axis.get("axis"), axis.get("verdict"))
          PY

      - name: Upload the manifest, the assembly report and the aggregate
        if: always()
        uses: actions/upload-artifact@v4
        with:
          # Same single value as the checkout. `env` is not available in job-level
          # `concurrency`/`if`, which is why those two keep the long form below.
          name: s11-ac11-aggregate-${{ env.SOURCE_SHA }}
          path: evidence/
          if-no-files-found: error
          retention-days: 90

      - name: This lane records; it does not promote
        shell: bash
        run: |
          set -euo pipefail
          echo "Candidate SHA $SOURCE_SHA. A pre-landing aggregation describes that SHA only."
          echo "After landing, finish the landing runbook's lane binding first -- this lane"
          echo "reads the other lanes' artifacts -- then dispatch this one at the landed tip:"
          echo "  LAND=\$(git ls-remote origin refs/heads/integration/all-agents-unified | cut -f1)"
          echo "  gh workflow run ac11-aggregate.yml --ref integration/all-agents-unified -f source_sha=\$LAND"
          echo "The procedure of record is the card 203 History §5-4."
          echo "aggregator exit ${{ steps.aggregate.outputs.exit_code }}"
