name: AC-11 Axis Aggregation
# Only a dispatch that passes `correlation_id` changes this; every other event keeps the
# workflow name. The value is used for the run's display name only.
run-name: ${{ inputs.correlation_id || github.workflow }}

# `workflow_dispatch` only, and deliberately no `push`.
#
# Two reasons, and neither is tidiness. A workflow that triggered on a push to
# integration/all-agents-unified would owe a lane in tools/post_landing_verify.py -- the
# reverse ratchet in tests/core/test_post_landing_verify.py asserts exactly that -- and
# this is not a landing gate: it reads the *other* lanes' artifacts, so it has nothing to
# say until they have run. And the aggregation is about one exact SHA; running it on every
# push would produce a stream of INVALID_RUN answers about trees nobody was asking about.
on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: 'The exact 40-hex commit to aggregate. Envelopes from any other SHA are refused.'
        required: true
      correlation_id:
        description: 'Opaque id for a tool to bind this exact run; leave empty for a normal manual run'
        required: false
        default: ''

# `actions: read` is the whole reason this is a separate lane: it reads other runs'
# artifacts, which `contents: read` cannot do. Nothing here writes to the repository.
permissions:
  contents: read
  actions: read

jobs:
  ac11-aggregate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: ac11-aggregate-${{ inputs.source_sha }}
      cancel-in-progress: false
    env:
      SOURCE_SHA: ${{ inputs.source_sha }}
      REPO: ${{ github.repository }}
      ENVELOPES: evidence/ac11-axes
      MANIFEST: evidence/ac11-aggregate-manifest.json
      ASSEMBLY: evidence/ac11-assembly-report.json
      RESULT: evidence/ac11-aggregate-result.json
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Refuse anything that is not an exact commit
        shell: bash
        run: |
          set -euo pipefail
          if ! printf '%s' "$SOURCE_SHA" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "source_sha must be a full 40-hex lowercase commit, got '$SOURCE_SHA'" >&2
            exit 1
          fi

      - name: Checkout that exact commit
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}
          # The aggregator reads the migration graph and compares trees, so it needs the
          # history, not just this commit.
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - run: python -m pip install -r requirements-test.txt

      - name: Collect the axis envelopes that exist at this SHA
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$ENVELOPES"
          # One row per axis whose chain the sources file calls complete: the workflow file,
          # the artifact name prefix, the envelope member and the importer. Read from the
          # file rather than written here, so adding an axis is a change to the file.
          python - <<'PY' > /tmp/complete.tsv
          import json, pathlib
          doc = json.loads(pathlib.Path("docs/ac11-axis-sources.json").read_text(encoding="utf-8"))
          seen = set()
          for entry in doc["axes"]:
              if entry["chain"] != "complete":
                  continue
              key = (entry["workflow"], entry["artifactNamePrefix"])
              if key in seen:
                  continue          # two axes can share one run; collect it once
              seen.add(key)
              print("\t".join([
                  entry["workflow"].rsplit("/", 1)[-1],
                  entry["artifactNamePrefix"],
                  entry["importer"],
                  entry["importerArchiveFlag"],
              ]))
          PY
          while IFS=$'\t' read -r workflow prefix importer archive_flag; do
            echo "::group::$workflow"
            run_id=$(gh run list --workflow "$workflow" --limit 50 \
              --json databaseId,headSha,status,conclusion \
              --jq "[.[] | select(.headSha == \"$SOURCE_SHA\" and .status == \"completed\" and .conclusion == \"success\")] | if length > 0 then (.[0].databaseId | tostring) else \"\" end")
            if [ -z "$run_id" ]; then
              echo "no successful run of $workflow at $SOURCE_SHA -- this axis will be absent"
              echo "::endgroup::"
              continue
            fi
            artifact_id=$(gh api "repos/$REPO/actions/runs/$run_id/artifacts" \
              --jq "[.artifacts[] | select(.name == \"$prefix$SOURCE_SHA\")] | if length == 1 then (.[0].id | tostring) else \"\" end")
            if [ -z "$artifact_id" ]; then
              echo "run $run_id has no single artifact named $prefix$SOURCE_SHA -- absent"
              echo "::endgroup::"
              continue
            fi
            gh api "repos/$REPO/actions/runs/$run_id"            > /tmp/run.json
            gh api "repos/$REPO/actions/artifacts/$artifact_id"  > /tmp/artifact.json
            gh api "repos/$REPO/actions/artifacts/$artifact_id/zip" > /tmp/artifact.zip
            base=$(basename "$importer" .py)
            # The flag name comes from the sources file: the two importers in this chain
            # take the zip under different names, and trying both would turn a real
            # refusal into a retry with the wrong flag.
            python "$importer" \
              "$archive_flag" /tmp/artifact.zip \
              --run-metadata /tmp/run.json \
              --artifact-metadata /tmp/artifact.json \
              --output "$ENVELOPES/$base.json"
            echo "::endgroup::"
          done < /tmp/complete.tsv
          ls -la "$ENVELOPES" || true

      - name: Assemble the manifest, naming every axis it could not
        shell: bash
        run: |
          set -euo pipefail
          python tools/assemble_ac11_manifest.py \
            --release-sha "$SOURCE_SHA" \
            --envelopes "$ENVELOPES" \
            --output "$MANIFEST" \
            --report "$ASSEMBLY"
          cat "$ASSEMBLY"

      - name: Recompute the eight axes
        id: aggregate
        shell: bash
        run: |
          set -uo pipefail
          code=0
          python tools/aggregate_ac11_evidence.py \
            --manifest "$MANIFEST" \
            --output "$RESULT" || code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          # 0 all eight recomputed MEASURED_PASS, 1 valid evidence and AC-11 not done,
          # 2 the manifest or an envelope is invalid. All three are answers; only an
          # unexpected code is a failure of this lane.
          case "$code" in
            0|1|2) echo "the aggregator reached a verdict (exit $code)" ;;
            *) echo "the aggregator did not run (exit $code)" >&2; exit "$code" ;;
          esac
          python - <<'PY'
          import json, os, pathlib
          result = json.loads(pathlib.Path(os.environ["RESULT"]).read_text(encoding="utf-8"))
          print("verdict:", result.get("verdict"), "done:", result.get("done"))
          for axis in result.get("axes", []):
              print(" ", axis.get("axis"), axis.get("verdict"))
          PY

      - name: Upload the manifest, the assembly report and the aggregate
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: s11-ac11-aggregate-${{ inputs.source_sha }}
          path: evidence/
          if-no-files-found: error
          retention-days: 90

      - name: This lane records; it does not promote
        shell: bash
        run: |
          set -euo pipefail
          echo "Candidate SHA $SOURCE_SHA. A pre-landing aggregation describes that SHA only."
          echo "After landing, finish the landing runbook's lane binding first -- this lane"
          echo "reads the other lanes' artifacts -- then dispatch this one at the landed tip:"
          echo "  LAND=\$(git ls-remote origin refs/heads/integration/all-agents-unified | cut -f1)"
          echo "  gh workflow run ac11-aggregate.yml --ref integration/all-agents-unified -f source_sha=\$LAND"
          echo "The procedure of record is the card 203 History §5-4."
          echo "aggregator exit ${{ steps.aggregate.outputs.exit_code }}"
