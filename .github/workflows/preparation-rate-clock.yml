name: Preparation rate clock real PG
run-name: Preparation rate clock real PG - ${{ github.sha }}

on:
  push:
    branches:
      - agent/codex/fleet5-prepare-rate-clock-test-20261106
    paths:
      - .github/workflows/preparation-rate-clock.yml
      - tests/integration/test_build_preparations_real_pg.py
      - tests/proofs/run_preparation_rate_clock.py

permissions:
  contents: read

concurrency:
  group: preparation-rate-clock-${{ github.ref }}
  cancel-in-progress: false

jobs:
  real-pg:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: invowner
          POSTGRES_PASSWORD: ci_local_only
          POSTGRES_DB: invdev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U invowner -d invdev"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      INV_ENV: test
      INV_TEST_ADMIN_DSN: postgresql://invowner:ci_local_only@127.0.0.1:5432/invdev
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements-test.txt
            requirements-core.txt
      - name: Record exact source and initial tool provenance
        run: python -B tests/proofs/run_preparation_rate_clock.py provenance-start
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
          cache: false
      - name: Install existing pinned test requirements
        run: python -m pip install -r requirements-test.txt
      - name: Build existing isolated Node and synthetic workspace image
        working-directory: services/node-agent
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/.work/node-image" "$GITHUB_WORKSPACE/dist"
          CGO_ENABLED=0 go build -trimpath -o "$GITHUB_WORKSPACE/dist/inv-node" ./cmd/inv-node
          CGO_ENABLED=0 go build -trimpath -o "$GITHUB_WORKSPACE/.work/node-image/probe" ./tests/probe
          CGO_ENABLED=0 go build -trimpath -o "$GITHUB_WORKSPACE/.work/node-image/inv-supervisor" ./cmd/inv-supervisor
          cp tests/probe/Dockerfile "$GITHUB_WORKSPACE/.work/node-image/Dockerfile"
          python -B "$GITHUB_WORKSPACE/tools/prepare_git_probe.py" "$GITHUB_WORKSPACE/.work/node-image"
          docker build --network=none --pull=false -t "inv-node-test:$GITHUB_SHA" "$GITHUB_WORKSPACE/.work/node-image"
          echo "INV_NODE_IMAGE=$(docker image inspect --format '{{.Id}}' "inv-node-test:$GITHUB_SHA")" >> "$GITHUB_ENV"
          echo "INV_NODE_BINARY=$GITHUB_WORKSPACE/dist/inv-node" >> "$GITHUB_ENV"
          echo "INV_RUN_NODE_TESTS=1" >> "$GITHUB_ENV"
      - name: Prove original same-window green and exact rollover red on real PG
        run: python -B tests/proofs/run_preparation_rate_clock.py controls
      - name: Run the entire affected file with strict positive and skip gates
        if: ${{ !cancelled() }}
        run: python -B tests/proofs/run_preparation_rate_clock.py positive
      - name: Record final tool and fixture provenance
        if: always()
        run: python -B tests/proofs/run_preparation_rate_clock.py provenance-end
      - name: Preserve original results and opaque diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: preparation-rate-clock-real-pg-${{ github.sha }}
          path: .work/preparation-rate-clock/
          if-no-files-found: error
          retention-days: 30
